  });

  /* ---- persistência: última simulação (automática) e cenários com nome ---- */
  function estado(){
    const el=$S("estado");if(!el)return;
    const o=SIM_ST.origem||{tipo:"padrao"};let t;
    if(o.tipo==="padrao")t="Entradas: valores iniciais calculados do preço-alvo e do rebanho (primeira simulação). Ao editar, seus números ficam guardados e passam a ser o padrão.";
    else if(o.tipo==="ultima")t=`Entradas: sua última simulação, salva em ${fmtPub(o.em)}`+(o.dataBase&&o.dataBase!==b.dataBase?` sobre a posição de ${dmy(o.dataBase)} — a posição do modelo já é de ${db}; seus números foram mantidos`:"")+(o.local?" (cópia guardada neste aparelho, mais nova que a do banco)":"")+".";
    else t=`Entradas: cenário "${o.nome}" de ${o.de} (salvo em ${fmtPub(o.em)}). Ao editar, vira a sua última simulação.`;
    if(SIM_ST.salvoErro)t+=` Não gravou no banco (${SIM_ST.salvoErro}); guardado neste aparelho.`;
    else if(SIM_ST.salvoEm)t+=` Salvo às ${new Date(SIM_ST.salvoEm).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}.`;
    el.textContent=t;
  }
  function resultadoResumo(){const r=SIM_ST.ultimo?.r;return r?{receita:Math.round(r.rec),resultado:Math.round(r.res),custo_cab:Math.round(r.custoCab),saldo_caixa:Math.round(r.saldo),resultado_economico:Math.round(r.econ),cab_vendidas:r.vend,preco_medio:Math.round(r.pm)}:null;}
  async function simSalvar(nome){
    const reg={usuario_email:simEmail(),nome,modo:SIM_ST.modo,entradas:SIM_ST.v,resultado:resultadoResumo(),posicao_id:D.posicao?.id||null,data_base:b.dataBase,atualizado_em:new Date().toISOString()};
    try{localStorage.setItem(simChaveLocal(nome),JSON.stringify(reg));}catch(e){}
    if(!reg.usuario_email){SIM_ST.salvoErro="sem usuário";estado();return null;}
    try{
      const{data,error}=await sb.from("simulacoes").upsert(reg,{onConflict:"usuario_email,nome"}).select().single();
      if(error)throw error;
      const linha=data||reg, i=D.sims.findIndex(s=>(s.usuario_email||"").toLowerCase()===reg.usuario_email&&s.nome===nome);
      if(i>=0)D.sims[i]=linha;else D.sims.unshift(linha);
      SIM_ST.salvoErro=null;SIM_ST.salvoEm=linha.atualizado_em;
      if(nome==="ultima"&&SIM_ST.origem?.tipo==="padrao")SIM_ST.origem={tipo:"ultima",em:linha.atualizado_em,dataBase:b.dataBase};

    }catch(e){SIM_ST.salvoErro=e?.message||String(e);estado();return null;}
  }
  function simAgendarSalvar(){clearTimeout(SIM_ST.timer);SIM_ST.timer=setTimeout(()=>simSalvar("ultima"),1200);}
  /* simulações salvas: cada usuário guarda até SIM_MAX cenários com nome (decisão de 28/10/2026) e pode excluir os seus;
     os dos outros sócios aparecem só para abrir. A "última simulação" (gravação automática) não conta no limite.
     O banco garante o mesmo limite (gatilho em db/21) e só deixa cada um excluir as próprias. */
  const SIM_MAX=6;
  const eu=()=>simEmail();
  const minhasSalvas=()=>D.sims.filter(s=>(s.usuario_email||"").toLowerCase()===eu()&&s.nome!=="ultima");
  const MODO_CURTO={lote:"Lote inteiro",frentefundo:"Frente + fundo",frente:"Frente, fundo fica",refugo:"Comprador refuga"};
  function listarSalvas(){
    const minhas=minhasSalvas(), outras=D.sims.filter(s=>(s.usuario_email||"").toLowerCase()!==eu());

    const linha=(s,minha)=>`<div class="sim-item" data-id="${esc(s.id)}"><div class="si-txt"><div class="si-nome">${esc(minha?s.nome:(s.usuario_email||"").split("@")[0]+": "+(s.nome==="ultima"?"última simulação":s.nome))}</div>`+
      `<div class="si-meta"><span class="nw">${esc(MODO_CURTO[s.modo]||s.modo)}</span> · <span class="nw">posição ${esc(dmy(s.data_base))}</span> · <span class="nw">salva ${esc(fmtPub(s.atualizado_em))}</span></div></div>`+
      `<div class="si-acoes"><button class="btn sm" type="button" data-acao="abrir">Abrir</button>${minha?`<button class="btn sm si-del" type="button" data-acao="excluir">Excluir</button>`:`<span></span>`}</div></div>`;
    $S("lista").innerHTML=`<div class="sim-lista-tit"><span>Minhas simulações</span><span class="selo ${minhas.length>=SIM_MAX?"prog":"hist"}">${minhas.length} de ${SIM_MAX}</span></div>`+
      (minhas.length?minhas.map(x=>linha(x,true)).join(""):`<p class="note">Nenhuma simulação salva. Use "Salvar como…" para guardar até ${SIM_MAX}.</p>`)+
      (outras.length?`<div class="sim-lista-tit"><span>De outros sócios</span><span class="selo hist">só leitura</span></div>`+outras.map(x=>linha(x,false)).join(""):"");
  }
  function aplicar(s,origem){const nv=simMesclar(simPadrao(b),s.entradas);for(const k in nv)st[k]=nv[k];SIM_ST.modo=SIM_MODES[s.modo]?s.modo:"lote";SIM_ST.origem=origem;SIM_ST.salvoEm=null;SIM_ST.salvoErro=null;marcarAba();renderInputs();estado();simAgendarSalvar();}
  async function excluir(s,btn){
    btn.disabled=true;btn.textContent="Excluindo…";
    try{const{error}=await sb.from("simulacoes").delete().eq("id",s.id);if(error)throw error;}
    catch(e){btn.disabled=false;btn.textContent="Falhou";btn.title=e?.message||String(e);return;}

  $S("salvas").addEventListener("click",()=>{const l=$S("lista");l.hidden=!l.hidden;$S("salvas").setAttribute("aria-expanded",String(!l.hidden));if(!l.hidden){$S("nomeForm").hidden=true;listarSalvas();}igualarKpis();});
  $S("lista").addEventListener("click",e=>{const btn=e.target.closest("button[data-acao]");if(!btn)return;const s=D.sims.find(x=>x.id===btn.closest(".sim-item").dataset.id);if(!s)return;

    if(btn.dataset.conf!=="1"){btn.dataset.conf="1";btn.textContent="Confirmar";btn.classList.add("conf");clearTimeout(btn._t);btn._t=setTimeout(()=>{btn.dataset.conf="";btn.textContent="Excluir";btn.classList.remove("conf");},4000);return;}
    clearTimeout(btn._t);excluir(s,btn);});
  function atualizarAviso(){const n=minhasSalvas().length,av=$S("nomeAviso");if(!av)return;
    av.textContent=n>=SIM_MAX?`Limite de ${SIM_MAX} simulações salvas. Exclua uma em "Salvas" para guardar outra, ou repita o nome de uma existente para substituí-la.`:`Você tem ${n} de ${SIM_MAX} simulações salvas. Repetir um nome substitui a simulação.`;}
  $S("salvarComo").addEventListener("click",()=>{const f=$S("nomeForm");f.hidden=!f.hidden;if(!f.hidden){$S("lista").hidden=true;$S("salvas").setAttribute("aria-expanded","false");atualizarAviso();$S("nome").focus();}});
  $S("nomeCancel").addEventListener("click",()=>{$S("nomeForm").hidden=true;});
  $S("nomeForm").addEventListener("submit",async e=>{e.preventDefault();const nome=$S("nome").value.trim().replace(/\s+/g," ");if(!nome||nome.toLowerCase()==="ultima")return;
    if(minhasSalvas().length>=SIM_MAX&&!minhasSalvas().some(x=>x.nome===nome)){atualizarAviso();$S("nomeAviso").classList.add("bad");return;}
    $S("nomeAviso").classList.remove("bad");
    const l=await simSalvar(nome);if(l){SIM_ST.origem={tipo:"cenario",nome,de:simEmail().split("@")[0],em:l.atualizado_em};$S("nomeForm").hidden=true;$S("nome").value="";listarSalvas();estado();}});

  /* ---- resumo exportável: Excel (.xlsx, gerado aqui mesmo, sem biblioteca) e PDF (impressão do navegador → "Salvar como PDF"),
     das mesmas linhas da tela ---- */
  const strip=x=>String(x??"").replace(/<[^>]+>/g,"");
  function resumoDados(){
    const u=SIM_ST.ultimo;if(!u)return null;const m=SIM_MODES[SIM_ST.modo];
    const agora=new Date();
    return {
      titulo:"Simulador de Venda do Lote — resumo da simulação",
      cabecalho:[["Gerado em",fmtPub(agora.toISOString())+" por "+simEmail().split("@")[0]],
        ["Posição do modelo","data-base "+db+" · publicada em "+fmtPub(b.publicadoEm)],["Forma de venda",m.label],["Venda prevista do que fica",dmy(b.vendaData)+" · "+b.dias+" dias"],["Rebanho na propriedade",b.N+" cab"]],
      secoes:[
        {t:"Entradas",cab:["Campo","Valor"],rows:m.fields.map(([id,label])=>[T(label),fmt(st[SIM_ST.modo][id],0)])},
        {t:"Resultado",cab:["Indicador","Valor","Detalhe"],rows:u.L.kpis.map(k=>[k[0],strip(k[1]),strip(k[2])])},
        {t:"Resultado do ciclo por competência",cab:["Item","R$","R$/cab vendida"],rows:u.L.dre.map(x=>[strip(x[0]),strip(x[1]),strip(x[2]),x[3]==="tot"])},
        {t:"Caixa dos sócios",cab:["Item","R$"],rows:u.L.caixa.map(x=>[strip(x[0]),strip(x[1]),undefined,x[3]==="tot"])},
        {t:"Ração gasta até a data-base",cab:["Item","Valor"],rows:u.L.racHoje.map(x=>[strip(x[0]),strip(x[1])])},
        {t:"Previsão de ração do grupo que fica",cab:["Item","Valor"],rows:u.L.racFut.map(x=>[strip(x[0]),strip(x[1]),undefined,x[3]==="tot"])}],
      notas:[u.L.econNote,u.L.racFutNote,regras]};
  }
  /* valor exibido → número para o Excel ("R$ 1.234,56", "+R$ 9.251", "−R$ 73.612", "3.000"); texto continua texto */
  function numDe(s){s=String(s??"").trim();let m=/^([+−-])?\s*R\$\s*(-?)([\d.]+(?:,\d+)?)$/.exec(s);
    if(m){let v=Number(m[3].replace(/\./g,"").replace(",","."));if(m[1]==="−"||m[1]==="-"||m[2]==="-")v=-v;return{v,f:"rs"};}
    m=/^-?[\d.]+(,\d+)?$/.exec(s);if(m&&/\d/.test(s))return{v:Number(s.replace(/\./g,"").replace(",",".")),f:"int"};return null;}
  function xlsxBlob(){
    const d=resumoDados();if(!d)return null;
    const X=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,"");
    /* estilos: 0 normal · 1 título · 2 faixa de seção · 3 cabeçalho de tabela · 4 R$ · 5 inteiro · 6 negrito · 7 R$ negrito · 8 nota (quebra de linha) */
    const linhas=[];let r=0;
    const cel=(c,val,est)=>{const ref=c+(r+1);if(val==null||val==="")return est?`<c r="${ref}" s="${est}"/>`:"";
      const n=(est===0||est===6)?numDe(val):null;
      if(n)return `<c r="${ref}" s="${n.f==="rs"?(est===6?7:4):5}"><v>${n.v}</v></c>`;
      return `<c r="${ref}" s="${est||0}" t="inlineStr"><is><t xml:space="preserve">${X(val)}</t></is></c>`;};
    const add=(cells,ht)=>{r++;linhas.push(`<row r="${r}"${ht?` ht="${ht}" customHeight="1"`:""}>${cells.join("")}</row>`);};
    const merges=[];
    add([cel("A",d.titulo,1)],22);
    d.cabecalho.forEach(([k,v])=>add([cel("A",k,6),cel("B",v,0)]));
    d.secoes.forEach(sc=>{add([]);add(["A","B","C"].map((c,i)=>cel(c,i?"":sc.t.toUpperCase(),2)));merges.push(`A${r}:C${r}`);
      add(sc.cab.map((h2,i)=>cel("ABC"[i],h2,3)));
      sc.rows.forEach(x=>{const e=x[3]?6:0;add([cel("A",x[0],e),cel("B",x[1],e),x[2]!==undefined?cel("C",x[2],e):""]);});});
    add([]);add(["A","B","C"].map((c,i)=>cel(c,i?"":"NOTAS",2)));merges.push(`A${r}:C${r}`);
    d.notas.forEach(n=>{add([cel("A",n,8)],Math.max(15,Math.ceil(String(n).length/110)*15));merges.push(`A${r}:C${r}`);});
    const sheet=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetPr><pageSetUpPr fitToPage="1"/></sheetPr><sheetViews><sheetView workbookViewId="0" showGridLines="0"/></sheetViews><cols><col min="1" max="1" width="64" customWidth="1"/><col min="2" max="2" width="26" customWidth="1"/><col min="3" max="3" width="22" customWidth="1"/></cols><sheetData>${linhas.join("")}</sheetData><mergeCells count="${merges.length}">${merges.map(m=>`<mergeCell ref="${m}"/>`).join("")}</mergeCells><pageMargins left="0.5" right="0.5" top="0.6" bottom="0.6" header="0.3" footer="0.3"/><pageSetup paperSize="9" orientation="portrait" fitToWidth="1" fitToHeight="0"/></worksheet>`;
    const styles=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><numFmts count="2"><numFmt numFmtId="164" formatCode="&quot;R$&quot; #,##0.00;[Red]-&quot;R$&quot; #,##0.00"/><numFmt numFmtId="165" formatCode="#,##0"/></numFmts>`+
      `<fonts count="4"><font><sz val="10"/><name val="Arial"/></font><font><b/><sz val="14"/><color rgb="FF2F5D46"/><name val="Arial"/></font><font><b/><sz val="10"/><color rgb="FFFFFFFF"/><name val="Arial"/></font><font><b/><sz val="10"/><name val="Arial"/></font></fonts>`+
      `<fills count="4"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF2F5D46"/></patternFill></fill><fill><patternFill patternType="solid"><fgColor rgb="FFE8F1E9"/></patternFill></fill></fills>`+
      `<borders count="2"><border/><border><bottom style="thin"><color rgb="FFC9D3CB"/></bottom></border></borders><cellStyleXfs count="1"><xf/></cellStyleXfs><cellXfs count="9">`+
      `<xf fontId="0" borderId="1" applyBorder="1"><alignment vertical="top" wrapText="1"/></xf>`+
      `<xf fontId="1" applyFont="1"/>`+
      `<xf fontId="2" fillId="2" applyFont="1" applyFill="1"/>`+
      `<xf fontId="3" fillId="3" borderId="1" applyFont="1" applyFill="1" applyBorder="1"/>`+
      `<xf numFmtId="164" fontId="0" borderId="1" applyNumberFormat="1" applyBorder="1"><alignment vertical="top"/></xf>`+
      `<xf numFmtId="165" fontId="0" borderId="1" applyNumberFormat="1" applyBorder="1"><alignment vertical="top"/></xf>`+
      `<xf fontId="3" fillId="3" borderId="1" applyFont="1" applyFill="1" applyBorder="1"><alignment vertical="top" wrapText="1"/></xf>`+
      `<xf numFmtId="164" fontId="3" fillId="3" borderId="1" applyNumberFormat="1" applyFont="1" applyFill="1" applyBorder="1"><alignment vertical="top"/></xf>`+
      `<xf fontId="0" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`;
    const files=[["[Content_Types].xml",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>`],
      ["_rels/.rels",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`],
      ["xl/workbook.xml",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="Simulação" sheetId="1" r:id="rId1"/></sheets></workbook>`],
      ["xl/_rels/workbook.xml.rels",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`],
      ["xl/styles.xml",styles],["xl/worksheets/sheet1.xml",sheet]];
    return new Blob([zipStore(files)],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
  }
  /* zip sem compressão (método 0) — suficiente para o .xlsx */
  function zipStore(files){
    const enc=new TextEncoder(),T32=zipStore.t||(zipStore.t=Array.from({length:256},(_,n)=>{let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;return c>>>0;}));
    const crc=u=>{let c=0xFFFFFFFF;for(const x of u)c=T32[(c^x)&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0;};
    const partes=[],central=[];let off=0;
    const u16=v=>[v&255,(v>>>8)&255],u32=v=>[v&255,(v>>>8)&255,(v>>>16)&255,(v>>>24)&255];
    for(const[nome,txt]of files){const n=enc.encode(nome),dados=enc.encode(txt),c=crc(dados);
      const loc=new Uint8Array([...u32(0x04034b50),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(c),...u32(dados.length),...u32(dados.length),...u16(n.length),...u16(0)]);
      partes.push(loc,n,dados);
      central.push(new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(c),...u32(dados.length),...u32(dados.length),...u16(n.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),n);
      off+=loc.length+n.length+dados.length;}
    const tamC=central.reduce((s,x)=>s+x.length,0);
    return new Blob([...partes,...central,new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(tamC),...u32(off),...u16(0)])]);
  }
  function nomeArquivo(ext){const a=new Date(),p=n=>String(n).padStart(2,"0");return `simulacao_${SIM_ST.modo}_${a.getFullYear()}-${p(a.getMonth()+1)}-${p(a.getDate())}_${p(a.getHours())}${p(a.getMinutes())}.${ext}`;}
  function baixarBlob(nome,blob){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=nome;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);}
  /* PDF: página de impressão só com o resumo; o navegador oferece "Salvar como PDF" (no iPhone: Compartilhar → Salvar em Arquivos) */
  function htmlResumo(){
    const d=resumoDados();if(!d)return"";
    const tb=sc=>`<section><h4>${esc(sc.t)}</h4><table><tr>${sc.cab.map((c,i)=>`<th${i?' class="n"':""}>${esc(c)}</th>`).join("")}</tr>${sc.rows.map(x=>`<tr${x[3]?' class="tot"':""}><td>${esc(x[0])}</td><td class="n">${esc(x[1])}</td>${sc.cab.length>2?`<td class="n">${esc(x[2]??"")}</td>`:""}</tr>`).join("")}</table></section>`;
    return `<h1>${esc(d.titulo)}</h1><table class="cab">${d.cabecalho.map(([k,v])=>`<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join("")}</table>${d.secoes.map(tb).join("")}<h4>Notas</h4>${d.notas.map(n=>`<p>${esc(n)}</p>`).join("")}`;
  }
  function gerarPdf(){
    let pr=document.getElementById("sim-print");if(pr)pr.remove();
    pr=document.createElement("div");pr.id="sim-print";pr.innerHTML=htmlResumo();document.body.appendChild(pr);
    const tit=document.title;document.title=nomeArquivo("pdf").replace(/\.pdf$/,"");
    const fim=()=>{document.title=tit;pr.remove();removeEventListener("afterprint",fim);};
    addEventListener("afterprint",fim);setTimeout(()=>window.print(),50);
  }
  $S("xlsx").addEventListener("click",()=>{const bl=xlsxBlob();if(bl)baixarBlob(nomeArquivo("xlsx"),bl);});
  $S("pdf").addEventListener("click",gerarPdf);
  window.SIM_API={dados:resumoDados,xlsx:xlsxBlob,html:htmlResumo}; // usado pelos testes (testes/harness.js)

  marcarAba();listarSalvas();renderInputs();estado();
}

/* ---------- vista: relatórios ---------- */
function viewRelatorios(main){
  /* aba de relatórios: hoje só a Posição Semanal; novos relatórios entram aqui como novos blocos */
  main.replaceChildren(h("section",{class:"card"},
    h("h2",{style:"font-family:var(--f-display);font-stretch:85%;margin:0 0 10px"},"Relatórios"),
    h("div",{class:"badge"},"Posição Semanal"),
    D.rel.length?h("div",{},
      relLinha(D.rel[0],true),
      D.rel.length>1?h("details",{class:"pasta-rel"},
        h("summary",{},"Posições anteriores ("+Math.min(3,D.rel.length-1)+")"),
        ...D.rel.slice(1,4).map(r=>relLinha(r,false))):null
    ):h("div",{class:"note"},"Nenhuma posição semanal registrada no banco ainda."),
    h("p",{class:"note",style:"margin-top:8px"},"A posição vigente fica em destaque; a pasta guarda as 3 anteriores. As mais antigas saem da exibição, mas permanecem registradas no banco.")));
}

function relLinha(r,vigente){
  let abrir;
  const ehImg=p=>/\.(png|jpe?g|gif|webp)$/i.test(p||"");
  if(r.storage_path){
    abrir=h("button",{class:"btn pri sm",type:"button"},"Abrir");
    abrir.addEventListener("click",()=>{
      const w=ehImg(r.storage_path)?null:window.open("about:blank","_blank");
      sb.storage.from("fotos").createSignedUrl(r.storage_path,3600).then(({data,error})=>{
        if(error){if(w)w.close();abrir.textContent="Falhou: "+error.message;return;}
        if(ehImg(r.storage_path))abrirViewer(data.signedUrl,r.titulo||"Relatório");
        else if(w)w.location=data.signedUrl;else location.href=data.signedUrl;
      });
    });
  } else if(r.path_local&&location.protocol==="file:"){
    if(ehImg(r.path_local)){
      abrir=h("button",{class:"btn pri sm",type:"button",onclick:()=>abrirViewer("file://"+encodeURI(r.path_local),r.titulo||"Relatório")},"Abrir");
    } else {
      abrir=h("a",{class:"btn pri sm",href:"file://"+encodeURI(r.path_local),target:"_blank",rel:"noopener",style:"text-decoration:none"},"Abrir");
    }
  } else {
    abrir=h("span",{class:"selo hist"},"arquivo no Mac");
  }
  const inp=h("input",{type:"file",accept:"image/*,.pdf,.html",hidden:true});
  const anexar=h("button",{class:"btn sm",type:"button",title:"O navegador pede a seleção do arquivo por segurança; a janela reabre na última pasta usada",onclick:()=>inp.click()},"Anexar ao banco (escolher arquivo)");
  inp.addEventListener("change",async()=>{
    const f=inp.files[0];if(!f)return;
    anexar.disabled=true;anexar.textContent="Enviando…";
    const path="relatorios/"+r.data_ref+"_"+f.name.replace(/[^A-Za-z0-9_.-]/g,"_");
    const{error}=await sb.storage.from("fotos").upload(path,f);
    if(error&&!/exists/i.test(error.message)){anexar.textContent="Falhou: "+error.message;anexar.disabled=false;return;}
    const{error:e2}=await sb.from("relatorios").update({storage_path:path}).eq("id",r.id);
    if(e2){anexar.textContent="Falhou: "+e2.message;anexar.disabled=false;return;}
    await carregar();rerender();
  });
  return h("div",{class:"ev"},h("span",{class:"d"},dmy(r.data_ref)+" · "),r.titulo||"Relatório semanal"," ",
    vigente?h("span",{class:"selo vig"},"Vigente"):null,
    r.storage_path?h("span",{class:"selo "+(vigente?"hist":"hist")},"No banco"):h("span",{class:"selo hist"},"Arquivo no Mac")," ",
    abrir,r.storage_path?null:anexar,r.storage_path?null:inp);
}

(async()=>{const{data:{session}}=await sb.auth.getSession();session?start():loginView();})();
