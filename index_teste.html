<style>

/* Ficha de campo: barra de abas no topo, índice lateral de seções, corpo em fichas numeradas pelo passo 0; relatório renderizado da mesma base */
:root{
  --bg:#eef1ee; --surface:#ffffff; --ink:#18261f; --muted:#5d6b63; --line:#cfd8d2;
  --accent:#2f5d46; --accent-ink:#ffffff; --tag:#e7b416; --tag-ink:#2a2205;
  --ok:#2e7d4f; --warn:#b26b00; --bad:#b3261e; --soft:#e3ebe6;
  --f-display:"Archivo",system-ui,sans-serif; --f-body:"Source Sans 3",system-ui,-apple-system,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121915; --surface:#1a231e; --ink:#e3ebe6; --muted:#9aa9a0; --line:#2e3b34;
  --accent:#7fbf9b; --accent-ink:#0f1a14; --tag:#e7b416; --tag-ink:#2a2205;
  --ok:#6fcf97; --warn:#f2b45a; --bad:#f28b82; --soft:#223029; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121915; --surface:#1a231e; --ink:#e3ebe6; --muted:#9aa9a0; --line:#2e3b34;
  --accent:#7fbf9b; --accent-ink:#0f1a14; --tag:#e7b416; --tag-ink:#2a2205;
  --ok:#6fcf97; --warn:#f2b45a; --bad:#f28b82; --soft:#223029; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.brand{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.brand b{font-family:var(--f-display);font-stretch:80%;font-weight:800;font-size:20px;letter-spacing:.01em;text-transform:uppercase}
.brand span{color:var(--muted);font-size:13px}
.tag{display:inline-block;background:var(--tag);color:var(--tag-ink);font-family:var(--f-mono);font-size:11px;font-weight:600;padding:2px 7px;border-radius:3px;letter-spacing:.04em}
.tabs{display:flex;gap:4px;background:var(--soft);padding:3px;border-radius:8px}
.tabs button{border:0;background:transparent;color:var(--ink);font:600 14px var(--f-body);padding:6px 14px;border-radius:6px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.save{font-family:var(--f-mono);font-size:12px;color:var(--muted);min-width:150px;text-align:right}
.save.err{color:var(--bad)}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:230px minmax(0,1fr);gap:28px}
@media (max-width:820px){.wrap{grid-template-columns:minmax(0,1fr)}.toc{display:none}}
.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);align-self:start;display:grid;gap:2px}
.toc a{display:flex;justify-content:space-between;gap:8px;color:var(--ink);text-decoration:none;padding:6px 10px;border-radius:6px;font-size:14px}
.toc a:hover{background:var(--soft)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line);flex:none;margin-top:6px}
.dot.ok{background:var(--ok)} .dot.part{background:var(--warn)}
.intro{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:18px}
.intro h1{font-family:var(--f-display);font-stretch:85%;font-weight:800;font-size:26px;line-height:1.15;margin:0 0 6px;text-wrap:balance}
.intro p{margin:0;color:var(--muted);max-width:70ch}
.progress{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.progress strong{color:var(--ink);font-variant-numeric:tabular-nums}
section.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:16px;scroll-margin-top:90px}
.card h2{display:flex;gap:10px;align-items:center;font-family:var(--f-display);font-stretch:85%;font-weight:700;font-size:19px;margin:0 0 4px}
.card h2 .k{font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:1px 6px}
.card .why{color:var(--muted);font-size:14px;margin:0 0 14px;max-width:75ch}
label.f{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
input[type=text],input[type=date],input[type=number],input[type=email],input[type=password],textarea,select{font:15px var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%;min-width:0}
textarea{min-height:64px;resize:vertical}
input:focus,textarea:focus,select:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip span{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:14px;cursor:pointer;background:var(--bg);color:var(--ink)}
.chip input:checked + span{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip input:focus-visible + span{outline:2px solid var(--accent);outline-offset:1px}
.q{display:grid;gap:8px;padding:12px 0;border-top:1px dashed var(--line)}
.q:first-of-type{border-top:0;padding-top:0}
.q > .lbl{font-weight:700;font-size:14px}
.dec{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px 14px;padding:12px 0;border-top:1px dashed var(--line)}
.dec:first-of-type{border-top:0}
.dec .id{font-family:var(--f-mono);font-weight:600;color:var(--accent);padding-top:2px}
.dec .t{font-weight:700}
.dec .d{color:var(--muted);font-size:14px;margin:2px 0 8px}
.dec .ctl{display:grid;gap:8px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-family:var(--f-mono);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--soft);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
td input,td select{padding:5px 7px;font-size:14px}
.edit-tbl td{min-width:120px} .edit-tbl td:first-child{min-width:0}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 14px var(--f-body);padding:7px 14px;border-radius:6px;cursor:pointer}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sm{padding:4px 9px;font-size:13px}
.row-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
/* relatório */
.rep{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:24px clamp(16px,4vw,40px);max-width:900px}
.rep h1{font-family:var(--f-display);font-stretch:85%;font-weight:800;font-size:28px;line-height:1.15;margin:0 0 4px;text-wrap:balance}
.rep h2{font-family:var(--f-display);font-stretch:85%;font-weight:700;font-size:20px;margin:28px 0 8px;padding-top:12px;border-top:2px solid var(--ink)}
.rep h3{font-size:16px;margin:18px 0 6px}
.rep p,.rep li{max-width:72ch}
.rep ul{padding-left:20px}
.rep .meta{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.rep table{margin:6px 0 12px}
.rep .tbl{margin:6px 0 12px}
.rep .tbl table{margin:0}
.pill{display:inline-block;font-family:var(--f-mono);font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.pill.ok{color:var(--ok)} .pill.warn{color:var(--warn)} .pill.bad{color:var(--bad)} .pill.mut{color:var(--muted)}
.rep-actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.note{font-size:13px;color:var(--muted)}
pre.md{white-space:pre-wrap;font-family:var(--f-mono);font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;max-height:340px;overflow:auto}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

</style></head>
<body>
<style>
.login{max-width:420px;margin:8vh auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px;display:grid;gap:12px}
.login h1{font-family:var(--f-display);font-stretch:85%;font-weight:800;font-size:24px;margin:0}
.login p{margin:0;color:var(--muted);font-size:14px}
.msg{font-size:13px;color:var(--muted)} .msg.err{color:var(--bad)}
.appbar{display:flex;gap:10px;align-items:center;margin-left:auto}
.appbar .who{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.nav{display:flex;gap:4px;background:var(--soft);padding:3px;border-radius:8px;flex-wrap:wrap}
.nav[hidden]{display:none}
.nav button[hidden]{display:none}
.regform [hidden],.regform .grid2[hidden]{display:none!important}
.graf{max-width:100%;height:auto;display:block;margin-top:4px}
.graf .g-grade{stroke:var(--line);stroke-width:1}
.graf .g-txt{font:11px var(--f-mono);fill:var(--muted)}
.g-s1{fill:#2f7fd0}.g-s2{fill:#d08a1e}
.graf .g-l1{fill:none;stroke:#2f7fd0;stroke-width:2.2}.graf .g-l2{fill:none;stroke:#d08a1e;stroke-width:2.2}
.graf .g-p1{fill:#2f7fd0}.graf .g-p2{fill:#d08a1e}
.g-leg{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:4px}
.g-leg i{display:inline-block;width:12px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.g-leg i.g-s1{background:#2f7fd0}.g-leg i.g-s2{background:#d08a1e}
.c-grupo{margin:8px 0 6px} .c-grupo:first-of-type{margin-top:2px}
details.consulta{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:2px 12px;margin-bottom:10px}
details.consulta summary{cursor:pointer;font:600 15px var(--f-body);padding:11px 0;list-style:none;min-height:24px}
details.consulta summary::-webkit-details-marker{display:none}
details.consulta summary::before{content:"▸ ";color:var(--accent)}
details.consulta[open] summary::before{content:"▾ "}
details.consulta .c-corpo{padding:2px 0 12px;display:grid;gap:10px}
.regform label.f{display:grid;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
.ajuste{display:grid;gap:8px;max-width:240px}
.ajuste label.f{display:grid;gap:3px;font-size:12px;font-weight:600;color:var(--muted)}
.nav button{border:0;background:transparent;color:var(--ink);font:600 14px var(--f-body);padding:6px 13px;border-radius:6px;cursor:pointer}
.nav button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.mapwrap{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.mapwrap{grid-template-columns:minmax(0,1fr)}}
.map{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px}
.map svg{width:100%;height:auto;display:block}
.map .pasto{fill:var(--surface);stroke:none;cursor:pointer;transition:fill .15s}
.map .pasto.occ{fill:color-mix(in srgb,var(--accent) 22%,var(--surface))}
.map .pasto:hover{fill:color-mix(in srgb,var(--tag) 30%,var(--surface))}
.map .pasto.sel{fill:color-mix(in srgb,var(--tag) 55%,var(--surface))}
.map .pasto:focus{outline:none}
.map .pasto:focus-visible{outline:none;fill:color-mix(in srgb,var(--tag) 40%,var(--surface))}
.estr:focus{outline:none}
.map .rem{fill:url(#hatch);stroke:none;pointer-events:none}
.map .divisas{fill:none;stroke:var(--ink);stroke-width:1.4;stroke-linecap:round;pointer-events:none}
.estr{stroke:var(--ink);stroke-width:1.2;cursor:pointer;transition:filter .15s}
.estr:hover{filter:brightness(1.12)}
.estr.sel{stroke-width:2.2}
.e-agua{fill:color-mix(in srgb,#2f7fd0 55%,var(--surface))}
.e-cocho{fill:color-mix(in srgb,#e7b416 60%,var(--surface))}
.e-estoque{fill:color-mix(in srgb,#cc6b2c 60%,var(--surface))}
.e-maq{fill:color-mix(in srgb,#78909c 60%,var(--surface))}
.map .hit{fill:transparent;stroke:none;cursor:pointer}
.legend svg{vertical-align:-3px;margin-right:4px}
.map text{pointer-events:none;font-family:var(--f-display);font-weight:700;font-size:15px;fill:var(--ink)}
.map text.sm{font-family:var(--f-mono);font-weight:600;font-size:11px;fill:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:14px;height:10px;border:1px solid var(--ink);vertical-align:-1px;margin-right:4px}
.panel{border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--bg);display:grid;gap:10px;align-content:start}
.panel h3{font-family:var(--f-display);font-stretch:85%;font-size:22px;margin:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.badge{font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.ev{border-top:1px dashed var(--line);padding:8px 0;font-size:14px}
.comp-list{display:grid;gap:0;margin:-2px 0 0}
.alerta{border:1px solid var(--warn);border-left-width:4px;border-radius:8px;padding:9px 12px;display:grid;gap:3px;font-size:14px;background:var(--surface)}
.alerta b{font:600 12px var(--f-mono);letter-spacing:.04em;text-transform:uppercase;color:var(--warn)}
.alerta.bad{border-color:var(--bad)} .alerta.bad b{color:var(--bad)}
.alerta.ok{border-color:var(--ok)} .alerta.ok b{color:var(--ok)}
.alerta .acoes{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.card>.alerta{margin:10px 0 12px}
.regform .ou{font:600 11px var(--f-mono);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px;margin-top:2px}
.regform .ou::before,.regform .ou::after{content:"";flex:1;border-top:1px dashed var(--line)}
/* suínos — ficha do Chiqueiro */
.su-tb .r{text-align:right}
.su-tb tr.su-bl td{background:var(--soft);font:600 11px var(--f-mono);letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.su-tb .su-blc{float:right}
.su-sub{display:block;font:500 11px var(--f-mono);color:var(--muted);letter-spacing:.02em;margin-top:1px}
td .su-sub{white-space:nowrap}
.panel>*{min-width:0}
td.su-est{color:var(--muted)}
.su-card{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:4px;font-size:14px}
.su-card+.su-card{margin-top:-4px}
.su-l1{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-height:24px}
.su-l1 .selo{margin-left:0}
.su-acoes{margin-left:auto;display:flex;gap:6px}
.su-acoes-l{justify-content:flex-end;margin-top:6px}
.su-st{font-size:14px}
.su-hist{margin-top:2px}
.su-ev.su-canc{opacity:.55}
.su-ev.su-canc b{text-decoration:line-through}
.su-chk{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--muted);cursor:pointer}
.regform .su-chk input{width:auto;min-height:0;margin:2px 0 0}
.su-erro{color:var(--bad);font-size:13px}
.btn.bad{border-color:var(--bad);color:var(--bad)}
.fila-selo{display:inline-flex;align-items:center;gap:6px;font:600 11px var(--f-mono);letter-spacing:.04em;text-transform:uppercase;color:var(--warn);border:1px solid var(--warn);border-radius:999px;padding:2px 9px;cursor:pointer;white-space:nowrap}
.fila-selo.bad{color:var(--bad);border-color:var(--bad)}
.fila-selo[hidden]{display:none}
.fila-card{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100vw - 24px));max-height:calc(100vh - 40px);overflow:auto;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:8px}
.fila-lista{display:grid}
.fotogrid .foto-fila{position:relative}
.fotogrid .foto-fila::after{content:"A ENVIAR";position:absolute;left:4px;bottom:4px;font:600 9px var(--f-mono);letter-spacing:.04em;color:#fff;background:var(--warn);padding:2px 5px;border-radius:3px}
.su-conf{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px;padding:8px 10px;border:1px solid var(--bad);border-radius:8px;font-size:13px}
.su-conf>span:first-child{flex:1 1 180px}
.su-conf-b{display:flex;gap:6px;margin-left:auto}
.su-hist[hidden]{display:none}
.regform .btn.foto{min-height:44px}
.mud-row{display:flex;justify-content:flex-end;gap:6px;flex-wrap:wrap;margin-top:2px}
/* manejos: próximos, situação por protocolo, histórico e linha do tempo */
.mj-cab{display:flex;justify-content:space-between;align-items:center;gap:8px}
.seg{display:inline-flex;gap:2px;background:var(--soft);padding:2px;border-radius:7px}
.seg button{border:0;background:transparent;color:var(--ink);font:600 11.5px var(--f-body);padding:4px 9px;border-radius:5px;cursor:pointer;text-transform:none;letter-spacing:0}
.seg button[aria-selected="true"]{background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.mj-prox{display:grid;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.mj-it{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:baseline;padding:8px 10px;font-size:14px;cursor:pointer}
.mj-it+.mj-it{border-top:1px solid var(--line)}
.mj-d{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.mj-em{font-family:var(--f-mono);font-size:12px;color:var(--warn);white-space:nowrap}
.mj-em.bad{color:var(--bad)} .mj-em.ok{color:var(--muted)}
.mj-q{grid-column:2/-1;font-size:12.5px;color:var(--muted)}
.mj-bloco{display:grid;gap:8px}
.mj-det[hidden]{display:none}
.mj-it .mj-det,.mj-it .mj-prot{grid-column:1/-1}
.mj-row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 0;border-top:1px dashed var(--line);cursor:pointer}
.mj-row:first-child{border-top:0} .mj-row.est{cursor:default}
.mj-nome{font-weight:600;font-size:14.5px}
.mj-ult{grid-column:1/-1;font-size:13px;color:var(--muted)}
.mj-ult b{font-family:var(--f-mono);font-weight:600;color:var(--ink);font-size:12.5px}
.mj-st{grid-column:2;grid-row:1;font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap;text-align:right}
.mj-st.prog{color:var(--warn)} .mj-st.bad{color:var(--bad)}

/* ---------- posição do modelo (ponte modelo→banco) ----------
   O banco guarda os PRIMITIVOS da planilha (ponte_catalogo.json); aqui se calculam os derivados do Simulador
   a partir deles e da data-base — regras aprovadas em 27/10/2026:
   · serviço pleno = último mês realizado sem a depreciação do mês + depreciação plena;
   · pro-rata do mês corrente = dia da data-base ÷ dias do mês (0 se o mês já está realizado na matriz);
   · depreciação já lançada = realizada na matriz (meses fechados) + plena × pro-rata do mês corrente;
   · rebanho na propriedade = compradas − mortes + pré-existentes.

  const a=Number(String(p.valor).replace(",","."));const m=Number(P[k]);if(!Number.isFinite(a)||!Number.isFinite(m))return null;

    feno:n("feno_apontado_rs"),fenoRolos:n("feno_rolos_apontados"),fenoKgRolo:n("feno_kg_rolo"),fenoKg:n("feno_rolos_apontados")*n("feno_kg_rolo"),

/* ---------- visualizador com zoom contínuo (scroll/pinça, +/−, ajustar) ---------- */
function abrirViewer(src,titulo,op={}){
  let sc=1,tx=0,ty=0;
  const img=h("img",{src,alt:titulo||"",draggable:"false",
    style:"position:absolute;left:0;top:0;transform-origin:0 0;max-width:none;max-height:none;user-select:none"});
  const area=h("div",{style:"position:absolute;inset:0;overflow:hidden;cursor:grab;touch-action:none"},img);
  const bt=(t,f)=>h("button",{class:"btn sm",type:"button",style:"min-width:44px",onclick:f},t);
  const barra=h("div",{style:"position:absolute;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));max-width:calc(100vw - 16px);display:flex;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;align-items:center;box-shadow:0 4px 14px rgba(0,0,0,.35)"},
    bt("−",()=>zoomAt(ov.clientWidth/2,ov.clientHeight/2,1/1.3)),
    bt("+",()=>zoomAt(ov.clientWidth/2,ov.clientHeight/2,1.3)),
    bt("Ajustar",fit),
    titulo&&!op.semRotulo?h("span",{class:"d",style:"font-family:var(--f-mono);font-size:11px;color:var(--muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"},titulo):null,
    bt("Fechar",()=>ov.remove()));
  const ov=h("div",{class:"fotofull",style:"cursor:default"},area,barra);

  function fit(){const w=ov.clientWidth,hh=ov.clientHeight-(barra.offsetHeight+28);
    sc=Math.min(w/img.naturalWidth,hh/img.naturalHeight)*0.96;
    tx=(w-img.naturalWidth*sc)/2;ty=(hh-img.naturalHeight*sc)/2;apply();}
  function zoomAt(cx,cy,f){const ns=Math.min(12,Math.max(0.05,sc*f));
    tx=cx-(cx-tx)*(ns/sc);ty=cy-(cy-ty)*(ns/sc);sc=ns;apply();}
  img.addEventListener("load",fit,{once:true});
  area.addEventListener("wheel",e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,e.deltaY<0?1.15:1/1.15);},{passive:false});
  area.addEventListener("dblclick",e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,2);});
  const pts=new Map();let lastDist=0;
  area.addEventListener("pointerdown",e=>{e.preventDefault();pts.set(e.pointerId,[e.clientX,e.clientY]);area.setPointerCapture(e.pointerId);area.style.cursor="grabbing";});
  area.addEventListener("pointermove",e=>{
    if(!pts.has(e.pointerId))return;
    const prev=pts.get(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);
    if(pts.size===1){tx+=e.clientX-prev[0];ty+=e.clientY-prev[1];apply();}
    else if(pts.size===2){const arr=[...pts.values()];
      const d=Math.hypot(arr[0][0]-arr[1][0],arr[0][1]-arr[1][1]);
      const cx=(arr[0][0]+arr[1][0])/2,cy=(arr[0][1]+arr[1][1])/2;
      if(lastDist>0)zoomAt(cx,cy,d/lastDist);
      lastDist=d;}
  });
  const solta=e=>{pts.delete(e.pointerId);lastDist=0;area.style.cursor="grab";};
  area.addEventListener("pointerup",solta);area.addEventListener("pointercancel",solta);
  document.body.append(ov);
}

/* ---------- zoom do mapa: pinça, duplo toque no fundo, arrastar quando ampliado; botões como garantia.
   Com o zoom próprio, ninguém precisa dar zoom na PÁGINA para acertar um cocho — o gesto sobre o mapa
   não dispara o zoom do navegador (touch-action controlado) e a interface em volta fica no tamanho normal. */
function ativarZoomMapa(cont,svg){
  let sc=1,tx=0,ty=0,moveu=0,ultimoTap=0,ultimoXY=null;
  const aplica=()=>{const w=cont.clientWidth,hh=cont.clientHeight;
    tx=Math.min(0,Math.max(w-w*sc,tx));ty=Math.min(0,Math.max(hh-hh*sc,ty));
    svg.style.transform=sc===1?"":`translate(${tx}px,${ty}px) scale(${sc})`;
    cont.style.touchAction=sc===1?"pan-y":"none";};
  const zoomAt=(cx,cy,f)=>{const r=cont.getBoundingClientRect();const x=cx-r.left,y=cy-r.top;
    const ns=Math.min(8,Math.max(1,sc*f));
    tx=x-(x-tx)*(ns/sc);ty=y-(y-ty)*(ns/sc);sc=ns;if(sc===1){tx=0;ty=0;}aplica();};
  const pts=new Map();let lastDist=0,tipoPonteiro="";
  cont.addEventListener("pointerdown",e=>{tipoPonteiro=e.pointerType;pts.set(e.pointerId,[e.clientX,e.clientY]);moveu=0;if(pts.size===2)lastDist=0;});
  cont.addEventListener("pointermove",e=>{
    if(!pts.has(e.pointerId))return;
    const prev=pts.get(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);
    moveu+=Math.hypot(e.clientX-prev[0],e.clientY-prev[1]);
    if(pts.size===2){const a=[...pts.values()];
      const d=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);
      const cx=(a[0][0]+a[1][0])/2,cy=(a[0][1]+a[1][1])/2;
      if(lastDist>0)zoomAt(cx,cy,d/lastDist);lastDist=d;e.preventDefault();}
    else if(pts.size===1&&sc>1){tx+=e.clientX-prev[0];ty+=e.clientY-prev[1];aplica();e.preventDefault();}
  });
  cont.addEventListener("pointerup",e=>{
    if(pts.has(e.pointerId)&&pts.size===1&&moveu<10){
      /* duplo toque (dedo) só no fundo do mapa; mouse usa o dblclick nativo */
      const interativo=e.target.closest&&e.target.closest(".pasto,.estr,.hit,button");
      if(!interativo&&e.pointerType==="touch"){const agora=Date.now();
        if(agora-ultimoTap<320&&ultimoXY&&Math.hypot(e.clientX-ultimoXY[0],e.clientY-ultimoXY[1])<30){
          moveu=999;/* o clique sintético que segue o 2º toque não pode selecionar um pasto recém-ampliado */
          zoomAt(e.clientX,e.clientY,2);ultimoTap=0;/* duplo toque sempre aproxima; mapa inteiro = pinça p/ fora ou botão ⤢ */
        }else{ultimoTap=agora;ultimoXY=[e.clientX,e.clientY];}}
    }
    pts.delete(e.pointerId);if(pts.size<2)lastDist=0;});
  cont.addEventListener("pointercancel",e=>{pts.delete(e.pointerId);lastDist=0;});
  cont.addEventListener("dblclick",e=>{if(tipoPonteiro==="touch")return;/* no toque, o duplo toque já tratou */
    /* mouse (desktop, sem pinça): duplo clique alterna ampliar × mapa inteiro */
    if(!(e.target.closest&&e.target.closest(".pasto,.estr,.hit,button"))){e.preventDefault();zoomAt(e.clientX,e.clientY,sc>1?0:2);}});
  /* arrastou/pinçou/deu duplo toque => o clique que se segue não seleciona nada (consome uma vez) */
  cont.addEventListener("click",e=>{if(moveu>10){e.stopPropagation();e.preventDefault();moveu=0;}},true);
  aplica();
}

/* ---------- mudança de pasto do lote (ficha do pasto, aba Pasto) ----------
   Uma gravação só, tudo ou nada: encerra a ocupação de origem (saída) e abre a nova no destino (entrada).
   Mudança parcial: a ocupação de origem segue com as cabeças que ficaram; a linha nova leva as que mudaram.
   Serve dos dois lados — "Mudar de pasto" no pasto ocupado e "Trazer lote para cá" no pasto de destino. */
const ocupVig=()=>D.mov.filter(m=>!m.saida);
const pastoDe=id=>D.pastos.find(p=>p.id===id);
const cultivarDe=p=>p?(D.pastagem.find(x=>x.pasto_id===p.id&&x.safra==="2026/27")?.cultivar||""):"";
const metaAltura=(chave,p)=>p?premNum(chave,["pasto:"+p.numero,"cultivar:"+cultivarDe(p)],null):null;
const descPasto=p=>{const oc=ocupVig().filter(m=>m.pasto_id===p.id);
  const situ=D.pastagem.find(x=>x.pasto_id===p.id&&x.safra==="2026/27")?.situacao;
  return p.nome+(oc.length?" · "+oc.map(m=>lote(m.lote_id)+" "+m.cabecas+" cab").join(" + "):" · livre")+(situ==="Em formação"?" · em formação":"");};
const numOuNulo=v=>{const s=String(v??"").trim().replace(",",".");if(!s)return null;const n=Number(s);return Number.isFinite(n)?n:NaN;};

/* botão + formulário embutido; `origem` = ocupação vigente (quando a ficha é do pasto ocupado) ou `destino` = pasto da ficha vazia */
function btnMudanca({origem,destino}){
  const b=h("button",{class:"btn sm mud-btn",type:"button"},origem?"Mudar de pasto":"Trazer lote para cá");
  b.addEventListener("click",()=>{const f=formMudanca({origem,destino,fechar:()=>{f.remove();b.hidden=false;}});b.hidden=true;(b.closest(".mud-row")||b).after(f);
    f.querySelector("select, input")?.focus({preventScroll:true});});
  return b;
}
function formMudanca({origem,destino,fechar}){
  const hoje=isoDia(Date.now());
  let orig=origem||ocupVig()[0]||null;
  const selOrig=origem?null:h("select",{},...ocupVig().map(m=>h("option",{value:m.id},lote(m.lote_id)+" · "+(pastoDe(m.pasto_id)?.nome||"—")+" · "+m.cabecas+" cab")));
  const selDest=destino?null:h("select",{});
  const data=h("input",{type:"date",value:hoje,max:hoje});
  const cab=h("input",{type:"number",inputmode:"numeric",min:"1",step:"1"});
  const hs=h("input",{inputmode:"decimal",placeholder:"cm"}),he=h("input",{inputmode:"decimal",placeholder:"cm"});
  const obs=h("input",{type:"text",placeholder:"observação"});
  const lHs=h("label",{class:"f"},"",hs),lHe=h("label",{class:"f"},"",he);
  const dest=()=>destino||pastoDe(selDest.value);
  const montarDest=()=>{if(!selDest||!orig)return;const atual=selDest.value;
    selDest.replaceChildren(...D.pastos.filter(p=>p.id!==orig.pasto_id).map(p=>h("option",{value:p.id},descPasto(p))));
    if(atual&&[...selDest.options].some(o=>o.value===atual))selDest.value=atual;};
  const metas=()=>{const po=pastoDe(orig?.pasto_id),pd=dest();
    const mS=metaAltura("altura_saida_meta_cm",po),mE=metaAltura("altura_entrada_meta_cm",pd);
    lHs.firstChild.textContent="Altura de saída · "+(po?.nome||"—")+(mS!=null?" · preconizado "+nf(mS,0):"");
    lHe.firstChild.textContent="Altura de entrada · "+(pd?.nome||"—")+(mE!=null?" · preconizado "+nf(mE,0):"");
    const parcial=orig&&Number(cab.value)>0&&Number(cab.value)<orig.cabecas;
    lHs.hidden=!!parcial;/* numa mudança parcial o lote segue no pasto de origem — não há saída a medir */
  };
  const montarOrig=()=>{if(selOrig)orig=ocupVig().find(m=>m.id===selOrig.value)||null;
    cab.value=orig?String(orig.cabecas):"";cab.max=orig?String(orig.cabecas):"";data.min=orig?.entrada||"";
    montarDest();metas();};
  if(selOrig)selOrig.addEventListener("change",montarOrig);if(selDest)selDest.addEventListener("change",metas);cab.addEventListener("input",metas);
  montarOrig();
  const ok=h("button",{class:"btn pri sm",type:"button"},"Gravar mudança"),fe=h("button",{class:"btn sm",type:"button"},"Fechar sem gravar");
  const f=h("div",{class:"regform mudanca"},h("div",{class:"badge"},destino?"Trazer lote para o "+destino.nome:"Mudança de pasto · "+lote(orig?.lote_id)),
    selOrig?h("label",{class:"f"},"Lote que muda",selOrig):null,
    selDest?h("label",{class:"f"},"Para o pasto",selDest):null,
    h("div",{class:"grid2"},h("label",{class:"f"},"Data da mudança",data),h("label",{class:"f"},"Cabeças que mudam",cab)),
    h("div",{class:"grid2"},lHs,lHe),obs,h("div",{class:"grid2"},fe,ok));
  fe.addEventListener("click",fechar);
  ok.addEventListener("click",async()=>{
    const pd=dest();if(!orig)return suErro(ok,"Não há lote em pasto para mudar.");if(!pd)return suErro(ok,"Escolha o pasto de destino.");
    if(pd.id===orig.pasto_id)return suErro(ok,"O lote já está nesse pasto.");
    const n=Number(cab.value);if(!Number.isInteger(n)||n<1||n>orig.cabecas)return suErro(ok,"Cabeças: informe de 1 a "+orig.cabecas+".");
    if(!/^\d{4}-\d{2}-\d{2}$/.test(data.value))return suErro(ok,"Informe a data da mudança.");
    if(data.value<orig.entrada)return suErro(ok,"A mudança não pode ser antes da entrada no pasto ("+dmy(orig.entrada)+").");
    if(data.value>hoje)return suErro(ok,"A data não pode ser futura — a mudança é apontada depois de feita.");
    const parcial=n<orig.cabecas;const vS=parcial?null:numOuNulo(hs.value),vE=numOuNulo(he.value);
    if(Number.isNaN(vS)||Number.isNaN(vE))return suErro(ok,"Altura em cm: só números.");
    if(ocupVig().some(m=>m.id!==orig.id&&m.lote_id===orig.lote_id&&m.pasto_id===pd.id))return suErro(ok,"Esse lote já tem ocupação vigente em "+pd.nome+".");
    const po=pastoDe(orig.pasto_id);
    const upd=parcial?{cabecas:orig.cabecas-n,obs:(orig.obs?orig.obs+" · ":"")+dmy(data.value)+": "+n+" cab para "+pd.nome}:{saida:data.value,...(vS!=null?{altura_saida_cm:vS}:{})};
    const linha={id:uuid4(),lote_id:orig.lote_id,pasto_id:pd.id,cabecas:n,entrada:data.value,obs:obs.value.trim()||(parcial?"parte do lote vinda de "+(po?.nome||"—"):null),...(vE!=null?{altura_entrada_cm:vE}:{})};
    const resumo="Mudança · "+lote(orig.lote_id)+" · "+(po?.nome||"—")+" → "+pd.nome+" · "+n+" cab · "+dmy(data.value).slice(0,5);
    ok.disabled=true;fe.disabled=true;ok.textContent="Gravando…";
    try{const r=await gravarLote(resumo,[{op:"update",tabela:"movimentacoes_pastos",chave:{id:orig.id},valores:upd},{op:"insert",tabela:"movimentacoes_pastos",linha}]);
      if(r.fila){rerenderAposGravar();selPasto(pd.numero,"pasto");return;}}
    catch(e){ok.disabled=false;fe.disabled=false;ok.textContent="Gravar mudança";return suErro(ok,"Falhou: "+e.message);}
    await carregar();rerender();selPasto(pd.numero,"pasto");});
  return f;
}

/* ---------- manejos: ficha do lote, central e componente compartilhado ----------
   Decisões do André (31/10/2026): o manejo vive na ficha do lote e numa central de Manejos; o pasto só aponta.
   Famílias: sanitário (vacina, vermífugo, endectocida, carrapaticida, tratamento), produção (pesagem, escore),
   identificação (brinco/marcação), movimentação (mudança de pasto, vinda das ocupações). Morte, venda e compra
   são rebanho (inventário), não manejo. Dois formatos de leitura ligados por um seletor — Situação (quadro por
   protocolo) e Linha do tempo (por mês) — até o André decidir no uso qual fica. */
const MJ_TIPOS={vacina:["Vacina","sanitario"],vermifugacao:["Vermífugo","sanitario"],endectocida:["Endectocida","sanitario"],carrapaticida:["Carrapaticida","sanitario"],
  tratamento:["Tratamento","sanitario"],pesagem:["Pesagem","producao"],escore:["Escore corporal","producao"],identificacao:["Identificação","identificacao"],
  transferencia:["Transferência","movimentacao"],apartacao:["Apartação","movimentacao"],compra:["Compra","rebanho"],venda:["Venda","rebanho"],morte:["Morte","rebanho"],outro:["Outro","outro"]};
const MJ_FAM={sanitario:"Sanitário",producao:"Produção",identificacao:"Identificação",movimentacao:"Movimentação",rebanho:"Rebanho",outro:"Outro"};
const MJ_ORDEM_FAM=["sanitario","producao","identificacao","movimentacao","outro","rebanho"];
const mjTipoRot=t=>(MJ_TIPOS[t]||[cap(t),"outro"])[0];
const mjFam=t=>(MJ_TIPOS[t]||[null,"outro"])[1];
const mjProdCurto=p=>p?String(p).split(/\s[(—–]|\s—\s|\s–\s/)[0].replace(/\s*\(.*$/,"").trim():"";
/* dias de hoje até a data (negativo = passado) */
const mjDelta=iso=>{const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(iso||"");if(!m)return 0;const h=new Date();
  return Math.round((Date.UTC(+m[1],+m[2]-1,+m[3])-Date.UTC(h.getFullYear(),h.getMonth(),h.getDate()))/86400000);};
const mjQuando=iso=>{const d=mjDelta(iso);return d===0?"hoje":d<0?"há "+nDias(-d):"em "+nDias(d);};
const dm=iso=>dmy(iso).slice(0,5);
const MJ_MESES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const mjMesRot=iso=>{const m=/^(\d{4})-(\d{2})/.exec(iso||"");return m?MJ_MESES[+m[2]-1]+" "+m[1]:"";};

/* ---------- suínos: ficha do Chiqueiro (db/28) ----------
   Plantel = soma dos movimentos realizados (razão). Grupo = bloco × categoria × sexo × condição × destino;
   matrizes e cachaço são grupos de 1 cabeça com identificação própria. O peso de um grupo é a última pesagem desde
   que o grupo se formou no bloco; transferência, reclassificação, desmame e castração levam o peso junto.
   Nada se apaga: corrigir = cancelar (o administrador cancela; os lançamentos ligados ao evento caem juntos). */
const SU_CATS=["leitões lactentes","creche","recria — ponto de corte","recria avançada","adultos em engorda","matriz","cachaço"];
const SU_MET=["estimativa por foto","informado","fita torácica","balança"];           /* ordem crescente de precisão */
const SU_ABAS=[["plantel","Plantel"],["reproducao","Reprodução"],["pesagens","Pesagens"],["alimentacao","Alimentação"],["sanidade","Sanidade"]];
const SU_ALIMENTOS=["Ração lactação","Ração gestação","Ração creche","Ração crescimento","Ração terminação","Milho","Farelo de soja","Mandioca","Verde / capim"];
let suTab="plantel";
const SU0={blocos:[],rep:[],mov:[],repro:[],pes:[],alim:[],san:[]};
const su=()=>D.su||SU0;
const suOk=r=>r.status==="realizado";
const cap=s=>s?s[0].toUpperCase()+s.slice(1):s;
const suBloco=id=>su().blocos.find(b=>b.id===id);
const suBlocoNome=id=>suBloco(id)?.nome||"—";
const suRep=id=>su().rep.find(r=>r.id===id);
const suUuid=()=>(globalThis.crypto&&crypto.randomUUID)?crypto.randomUUID():"xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c==="x"?r:(r&3|8)).toString(16);});
const suNum=v=>{if(v==null||String(v).trim()==="")return null;const x=Number(String(v).replace(/\./g,"").replace(",","."));return Number.isFinite(x)?x:null;};
const suNumDec=v=>{if(v==null||String(v).trim()==="")return null;const x=Number(String(v).replace(",","."));return Number.isFinite(x)?x:null;};
const suDesc=(a,b)=>a.data<b.data?1:a.data>b.data?-1:((a.criado_em||"")<(b.criado_em||"")?1:-1);
const suAsc=(a,b)=>-suDesc(a,b);
const suDias=(de,ate)=>Math.round((new Date(ate||hojeIso())-new Date(de))/86400000);
const suSomaDias=(iso,n)=>{const d=new Date(iso+"T12:00:00");d.setDate(d.getDate()+n);return isoDia(d);};
const suKeyG=m=>[m.bloco_id,m.categoria,m.sexo,m.condicao||"—",m.destino||"",m.reprodutor_id||""].join("|");
const suKeyP=m=>m.reprodutor_id?"r|"+m.reprodutor_id:[m.bloco_id,m.categoria,m.sexo,m.condicao||"—"].join("|");
const suSexo=g=>g.sexo+(g.condicao&&g.condicao!=="—"?" · "+g.condicao:"");
const suRotCat=g=>g.reprodutor_id?(suRep(g.reprodutor_id)?.identificacao||cap(g.categoria)):cap(g.categoria);
const suSubCat=g=>{const t=g.reprodutor_id?(suRotCat(g).toLowerCase().includes(g.categoria)?null:g.categoria):g.destino;return t?h("small",{class:"su-sub"},t):null;};
const suRotGrupo=g=>suBlocoNome(g.bloco_id)+" · "+suRotCat(g)+(g.reprodutor_id?"":" · "+suSexo(g))+(g.destino?" · "+g.destino:"");

async function carregarSuinos(){
  const q=(t,sel,ord)=>{let qq=sb.from(t).select(sel);if(ord)qq=qq.order(...ord);return qq.then(({data,error})=>{if(error)throw new Error(error.message);return data||[];});};
  try{
    const r=await Promise.all([
      q("suinos_blocos","id,estrutura_id,numero,nome,descricao,ativo,obs",["numero"]),
      q("suinos_reprodutores","id,identificacao,sexo,funcao,raca,nascimento,entrada,origem,situacao,saida,obs",["identificacao"]),
      q("suinos_movimentos","id,data,tipo,bloco_id,categoria,sexo,condicao,destino,reprodutor_id,cabecas,par_id,origem_tipo,origem_id,peso_vivo_kg,peso_carcaca_kg,valor_rs,contraparte,obs,status,autor_email,criado_em",["data",{ascending:false}]),
      q("suinos_reproducao","id,matriz_id,tipo,data,cachaco_id,metodo,resultado,vivos_f,vivos_m,natimortos,mumificados,desmamados,peso_medio_kg,bloco_id,par_id,obs,status,autor_email,criado_em",["data",{ascending:false}]),
      q("suinos_pesagens","id,data,bloco_id,categoria,sexo,condicao,reprodutor_id,cabecas,metodo,peso_min_kg,peso_max_kg,peso_medio_kg,perimetro_cm,comprimento_cm,par_id,obs,status,autor_email,criado_em",["data",{ascending:false}]),
      q("suinos_alimentacao","id,data,bloco_id,alimento,quantidade_kg,obs,status,autor_email,criado_em",["data",{ascending:false}]),
      q("suinos_sanidade","id,data,tipo,produto,dose,bloco_id,categoria,reprodutor_id,cabecas,par_id,obs,status,autor_email,criado_em",["data",{ascending:false}])]);
    return {blocos:r[0],rep:r[1],mov:r[2],repro:r[3],pes:r[4],alim:r[5],san:r[6]};
  }catch(e){return {...SU0};}
}

/* ---- plantel ---- */
const suOrdGrupo=(a,b)=>{const ba=suBloco(a.bloco_id)?.numero??99,bb=suBloco(b.bloco_id)?.numero??99;if(ba!==bb)return ba-bb;
  const ca=SU_CATS.indexOf(a.categoria),cb=SU_CATS.indexOf(b.categoria);if(ca!==cb)return ca-cb;
  if(a.sexo!==b.sexo)return a.sexo<b.sexo?-1:1;
  return (suRep(a.reprodutor_id)?.identificacao||a.destino||"")<(suRep(b.reprodutor_id)?.identificacao||b.destino||"")?-1:1;};
function suPlantel(){
  const g=new Map();
  for(const m of su().mov){if(!suOk(m))continue;const k=suKeyG(m);
    const x=g.get(k)||{bloco_id:m.bloco_id,categoria:m.categoria,sexo:m.sexo,condicao:m.condicao||"—",destino:m.destino||null,reprodutor_id:m.reprodutor_id||null,cab:0};
    x.cab+=m.cabecas;g.set(k,x);}
  return [...g.values()].filter(x=>x.cab!==0).sort(suOrdGrupo);
}
const suGrupos=()=>suPlantel().filter(g=>g.cab>0);
const suCabChave=kp=>suPlantel().filter(g=>suKeyP(g)===kp).reduce((s,g)=>s+g.cab,0);
const suBlocoDoRep=id=>suGrupos().find(g=>g.reprodutor_id===id)?.bloco_id||null;
const suAtivos=f=>su().rep.filter(r=>r.situacao==="ativo"&&(!f||r.funcao===f)).sort((a,b)=>a.identificacao.localeCompare(b.identificacao,"pt-BR",{numeric:true}));
/* início do grupo (para o peso): última data em que o saldo da chave de peso passou de zero para positivo */
function suInicio(kp){
  let s=0,ini=null;
  for(const m of su().mov.filter(m=>suOk(m)&&suKeyP(m)===kp).sort(suAsc)){const antes=s;s+=m.cabecas;if(antes<=0&&s>0)ini=m.data;}
  return ini;}
const suPesagensGrupo=g=>{const kp=suKeyP(g);const ini=g.reprodutor_id?null:suInicio(kp);
  return su().pes.filter(p=>suOk(p)&&suKeyP(p)===kp&&(!ini||p.data>=ini)).sort(suDesc);};
const suPeso=g=>suPesagensGrupo(g)[0]||null;
const suMedido=p=>p&&(p.metodo==="balança"||p.metodo==="fita torácica");
function suGmd(g){const ps=suPesagensGrupo(g).filter(suMedido);if(ps.length<2)return null;
  const a=ps[0],b=ps.find(p=>p.data<a.data);if(!b)return null;const d=suDias(b.data,a.data);return d>0?(a.peso_medio_kg-b.peso_medio_kg)/d:null;}
const suFita=(per,comp)=>per&&comp?per*per*comp/14400:null;

/* peso levado de um grupo de origem para o grupo de destino (antes de gravar o movimento) */
function suPesoLevado(orig,dest,cab,data,par){
  if(suKeyP(orig)===suKeyP(dest))return null;
  const po=suPeso(orig);if(!po)return null;
  const jaNoDestino=suCabChave(suKeyP(dest));const pd=jaNoDestino>0?suPeso(dest):null;
  if(jaNoDestino>0&&!pd)return null;
  const tot=jaNoDestino+cab,mix=(a,b)=>a==null||b==null?null:Math.round((Number(a)*jaNoDestino+Number(b)*cab)/tot*10)/10;
  const r={data,bloco_id:dest.bloco_id,categoria:dest.categoria,sexo:dest.sexo,condicao:dest.condicao||"—",reprodutor_id:dest.reprodutor_id||null,
    cabecas:tot,metodo:po.metodo,peso_min_kg:po.peso_min_kg,peso_max_kg:po.peso_max_kg,peso_medio_kg:Number(po.peso_medio_kg),

  const G=premNum("suinos_gestacao_dias",["geral"],114),W=premNum("suinos_desmame_dias",["geral"],42);
  const u=ev[0];

    const lt=so?suGrupos().filter(g=>g.bloco_id===b&&g.categoria==="leitões lactentes").reduce((s,g)=>s+g.cab,0):0;
    return {fase:null,txt:lt?"Com "+lt+" leitões lactentes no "+suBlocoNome(b)+" · registrar o parto para prever o desmame":"Sem registro reprodutivo"};}
  if(u.tipo==="cobertura"||(u.tipo==="diagnóstico"&&u.resultado==="positivo")){
    const cob=u.tipo==="cobertura"?u:ev.find(e=>e.tipo==="cobertura");

      return {fase:"gestante",prev,falta,cob,txt:(u.tipo==="diagnóstico"?"Prenhe (diagnóstico "+dmy(u.data).slice(0,5)+")":"Coberta em "+dmy(cob.data).slice(0,5))+" · parto previsto "+dmy(prev).slice(0,5)}; }
  }

    return {fase:"lactante",prev,falta,parto:u,lact,txt:(lact===0?"Parida hoje":"Parida em "+dmy(u.data).slice(0,5)+" · "+lact+(lact===1?" dia":" dias")+" de lactação")+" · desmame previsto "+dmy(prev).slice(0,5)};}
  const vazia=u.tipo==="desmame"?"desmame em "+dmy(u.data).slice(0,5):u.tipo==="diagnóstico"?"diagnóstico negativo em "+dmy(u.data).slice(0,5):u.tipo+" em "+dmy(u.data).slice(0,5);

/* ---------- fila de envio (db/29) ----------
   Todo apontamento vira um LOTE de passos guardado no celular (IndexedDB) e enviado ao banco de uma vez só pela
   função app_gravar: entra tudo ou nada. Sem conexão, o lote espera e sobe sozinho quando a rede volta, na ordem
   em que foi feito; o número do lote é gerado aqui, então reenviar nunca repete nada. Enquanto espera, o
   apontamento aparece nas fichas com o selo "A enviar". Fotos de chuva ficam guardadas com posição, data e hora
   da captura; o servidor lê quando a foto chega. */
const FILA={itens:[],esperas:{},rodando:false,offline:false,semBanco:false,rerenderPendente:false};
const FILA_DB="zk_fila_"+SUPA_URL.replace("https://","").split(".")[0];
const uuid4=()=>(globalThis.crypto&&crypto.randomUUID)?crypto.randomUUID():"xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c==="x"?r:(r&3|8)).toString(16);});
function filaAbrir(){return new Promise((ok,err)=>{if(!("indexedDB" in window))return err(new Error("sem IndexedDB"));
  const r=indexedDB.open(FILA_DB,1);r.onupgradeneeded=()=>{r.result.createObjectStore("itens",{keyPath:"id"});};
  r.onsuccess=()=>ok(r.result);r.onerror=()=>err(r.error);r.onblocked=()=>err(new Error("bloqueado"));});}
async function filaOp(modo,fn){let db;try{db=await filaAbrir();}catch(e){FILA.semBanco=true;return null;}
  return new Promise((ok,err)=>{const tx=db.transaction("itens",modo);const st=tx.objectStore("itens");let req=null;
    try{req=fn(st);}catch(e){db.close();return err(e);}
    tx.oncomplete=()=>{db.close();ok(req&&"result" in req?req.result:null);};tx.onerror=()=>{db.close();err(tx.error);};tx.onabort=()=>{db.close();err(tx.error||new Error("abortado"));};});}
const filaPersistir=it=>filaOp("readwrite",st=>st.put(it)).catch(()=>null);
async function filaCarregar(){const r=await filaOp("readonly",st=>st.getAll()).catch(()=>null);
  if(Array.isArray(r)){FILA.itens=r;FILA.itens.forEach(i=>{if(i.estado==="enviando")i.estado="aguardando";});}
  FILA.itens.sort((a,b)=>a.quando<b.quando?-1:1);}
async function filaAdicionar(it){FILA.itens.push(it);FILA.itens.sort((a,b)=>a.quando<b.quando?-1:1);await filaPersistir(it);aplicarFila();filaSelo();}
async function filaRemover(id){FILA.itens=FILA.itens.filter(i=>i.id!==id);delete FILA.esperas[id];await filaOp("readwrite",st=>st.delete(id)).catch(()=>null);aplicarFila();filaSelo();}
const filaItens=()=>FILA.itens;
const filaPendentes=()=>FILA.itens.filter(i=>i.estado==="aguardando"||i.estado==="enviando");
const filaAtencao=()=>FILA.itens.filter(i=>i.estado==="erro"||i.estado==="atencao");

/* --- tempo limite: sem resposta, tratamos como sem conexão (o reenvio é seguro: o lote tem número único) --- */
const comLimite=(p,ms)=>new Promise((ok,err)=>{const t=setTimeout(()=>err(new Error("Tempo esgotado (sem conexão?)")),ms);p.then(v=>{clearTimeout(t);ok(v);},e=>{clearTimeout(t);err(e);});});
const semRede=e=>pareceOffline(e)||/tempo esgotado|abort|timeout|timed out|network/i.test(String(e?.message||e));

/* --- gravação: o caminho único de todos os apontamentos --- */
async function gravarLote(resumo,passos,op={}){
  if(!passos||!passos.length)return{ok:true};
  const it={id:uuid4(),tipo:"lote",quando:new Date().toISOString(),resumo,passos,estado:"aguardando",tentativas:0,autor:D.email||null};
  await filaAdicionar(it);
  return esperarEnvio(it,op);
}
/* envia este item (e os anteriores, na ordem). Devolve {ok} quando gravou; {fila:true} quando ficou guardado
   sem conexão; lança erro quando o banco recusou (o item sai da fila — o usuário vê o motivo e corrige) */
function esperarEnvio(it,op={}){
  return new Promise((ok,err)=>{FILA.esperas[it.id]={ok,err,interativo:true,...op};enviarFila();});}
async function enviarFila(){
  if(FILA.rodando)return;FILA.rodando=true;let mudou=false,parouSemRede=false;   /* mudou = algo gravado em segundo plano (sem ninguém esperando) */
  try{
    for(const it of [...FILA.itens]){
      if(it.estado!=="aguardando")continue;
      it.estado="enviando";filaSelo();
      try{
        const r=await enviarItem(it);
        it.tentativas=(it.tentativas||0)+1;
        const w=FILA.esperas[it.id];delete FILA.esperas[it.id];
        if(r.concluido){await filaRemover(it.id);if(!w)mudou=true;}
        else{it.estado="atencao";it.resultado=r.r;it.erro=null;await filaPersistir(it);if(!w)mudou=true;}
        FILA.offline=false;
        if(w)w.ok(r.r?{ok:true,r:r.r}:{ok:true});
      }catch(e){
        if(semRede(e)){it.estado="aguardando";FILA.offline=true;parouSemRede=true;await filaPersistir(it);break;}
        it.tentativas=(it.tentativas||0)+1;it.erro=String(e?.message||e);
        const w=FILA.esperas[it.id];delete FILA.esperas[it.id];
        if(w&&w.interativo){await filaRemover(it.id);w.err(new Error(it.erro));}
        else{it.estado="erro";await filaPersistir(it);if(!w)mudou=true;}
      }
    }
    if(parouSemRede){for(const id of Object.keys(FILA.esperas)){const w=FILA.esperas[id];delete FILA.esperas[id];w.ok({fila:true});}}
  }finally{FILA.rodando=false;filaSelo();
    if(mudou){try{await carregar();}catch(e){}rerenderSeguro();}
    aplicarFila();}
}

async function rpcGravar(it){

      throw new Error(error.message||String(error));}

async function gravarDireto(passos){
  for(const p of passos){
    if(p.op==="insert"){const{error}=await sb.from(p.tabela).insert(p.linha);if(error)throw new Error(error.message);}
    else if(p.op==="update"){let q=sb.from(p.tabela).update(p.valores);for(const[k,v]of Object.entries(p.chave))q=q.eq(k,v);const{error}=await q;if(error)throw new Error(error.message);}
    else if(p.op==="rpc"){const{error}=await sb.rpc(p.nome,p.args||{});if(error)throw new Error(error.message);}
  }
  return{ok:true,direto:true};
}

/* ---------- GPS: posição presa ao instante da foto ----------
   Começa a acompanhar a posição ao abrir a ficha do pluviômetro ou a tela de Chuvas (o GPS funciona sem internet);
   ao fotografar, usa a posição mais precisa obtida perto do instante da captura. */
const GPS={watch:null,fixes:[],ate:0,erro:null};
function gpsIniciar(){if(!navigator.geolocation)return;GPS.ate=Date.now()+4*60000;if(GPS.watch!=null)return;
  GPS.watch=navigator.geolocation.watchPosition(p=>{GPS.erro=null;GPS.fixes.push({t:Date.now(),lat:p.coords.latitude,lon:p.coords.longitude,prec:Math.round(p.coords.accuracy)});
    GPS.fixes=GPS.fixes.slice(-60);if(Date.now()>GPS.ate)gpsParar();},e=>{GPS.erro=e;if(e&&e.code===1)gpsParar();},{enableHighAccuracy:true,maximumAge:0,timeout:30000});}
function gpsParar(){if(GPS.watch!=null&&navigator.geolocation){navigator.geolocation.clearWatch(GPS.watch);}GPS.watch=null;}
const gpsMelhor=t=>{const c=GPS.fixes.filter(f=>f.t>=t-90000&&f.t<=t+60000);return c.length?c.reduce((a,b)=>b.prec<a.prec?b:a):null;};
async function gpsEsperar(t,ms){gpsIniciar();const fim=Date.now()+ms;let m=gpsMelhor(t);
  while((!m||m.prec>25)&&Date.now()<fim){await new Promise(r=>setTimeout(r,700));const n=gpsMelhor(t);if(n&&(!m||n.prec<m.prec))m=n;}
  if(!m){const p=await pegarPosicao();if(p)m={t:Date.now(),...p};}
  return m;}
/* instante da captura: data da foto (EXIF) quando o arquivo traz; senão a data do arquivo; senão o toque no botão */
async function instanteCaptura(file,t0){
  try{const ex=await exifInstante(file);if(ex)return ex;}catch(e){}
  if(file.lastModified&&file.lastModified>t0-6*3600000&&file.lastModified<Date.now()+60000)return file.lastModified;
  return Math.max(t0,Date.now()-1000);
}
async function exifInstante(file){
  const buf=new DataView(await file.slice(0,256*1024).arrayBuffer());if(buf.byteLength<4||buf.getUint16(0)!==0xFFD8)return null;
  let o=2;
  while(o+4<buf.byteLength){const marker=buf.getUint16(o);const len=buf.getUint16(o+2);
    if(marker===0xFFE1&&buf.byteLength>o+10&&buf.getUint32(o+4)===0x45786966){const tiff=o+10;const le=buf.getUint16(tiff)===0x4949;const g16=p=>buf.getUint16(p,le),g32=p=>buf.getUint32(p,le);
      const ifd0=tiff+g32(tiff+4);let exif=0,n=g16(ifd0);
      for(let i=0;i<n;i++){const e=ifd0+2+i*12;if(g16(e)===0x8769){exif=tiff+g32(e+8);break;}}
      if(!exif)return null;n=g16(exif);let dt=null,off=null;
      const txt=(e)=>{const cnt=g32(e+4);const p=cnt>4?tiff+g32(e+8):e+8;let s="";for(let k=0;k<cnt&&p+k<buf.byteLength;k++){const c=buf.getUint8(p+k);if(!c)break;s+=String.fromCharCode(c);}return s;};
      for(let i=0;i<n;i++){const e=exif+2+i*12;const tag=g16(e);if(tag===0x9003)dt=txt(e);else if(tag===0x9011)off=txt(e);}
      if(!dt)return null;const m=/^(\d{4}):(\d{2}):(\d{2}) (\d{2}):(\d{2}):(\d{2})/.exec(dt);if(!m)return null;
      const iso=`${m[1]}-${m[2]}-${m[3]}T${m[4]}:${m[5]}:${m[6]}`+(off&&/^[+-]\d{2}:\d{2}$/.test(off)?off:"");
      const t=new Date(iso).getTime();return Number.isFinite(t)?t:null;}
    if((marker&0xFF00)!==0xFF00)return null;o+=2+len;}
  return null;
}

/* gráficos desenhados na largura real disponível (texto legível em qualquer tela) */
const larguraGraf=()=>Math.max(280,Math.min(720,((document.getElementById("main")||{}).clientWidth||360)-40));
/* gráfico de barras agrupadas (chuva diária) — SVG puro, escala no tema */
function grafChuvaDiaria(ps,dias){
  const W=larguraGraf(),H=190,ml=30,mr=6,mt=12,mb=22,iw=W-ml-mr,ih=H-mt-mb;
  const datas=[...Array(dias)].map((_,i)=>isoDia(Date.now()-(dias-1-i)*86400000));
  const val=(eid,d)=>D.chuva.filter(c=>c.estrutura_id===eid&&c.data===d).reduce((s,c)=>s+Number(c.mm||0),0);
  const max=Math.max(10,...datas.flatMap(d=>ps.map(p=>val(p.id,d))));
  const topo=Math.ceil(max/10)*10;
  const svg=s_("svg",{viewBox:`0 0 ${W} ${H}`,width:W,height:H,class:"graf",role:"img","aria-label":"Chuva diária, últimos "+dias+" dias"});
  [0,0.5,1].forEach(f=>{const y=mt+ih-ih*f;
    svg.append(s_("line",{x1:ml,x2:W-mr,y1:y,y2:y,class:"g-grade"}));
    const t=s_("text",{x:ml-5,y:y+4,"text-anchor":"end",class:"g-txt"});t.textContent=nf(topo*f,0);svg.append(t);});
  const gw=iw/dias,bw=Math.max(1.5,gw*0.8/ps.length);
  datas.forEach((d,i)=>{ps.forEach((p,k)=>{const v=val(p.id,d);if(!v)return;
      const bh=ih*v/topo;const r=s_("rect",{x:ml+i*gw+gw*0.1+k*bw,y:mt+ih-bh,width:bw,height:bh,class:"g-s"+(k%2+1)});
      const tt=s_("title");tt.textContent=nomeCurto(p)+" · "+dmy(d)+": "+nf(v,1)+" mm";r.append(tt);svg.append(r);});
    if(i%Math.ceil(dias/(W<420?4:6))===0||i===dias-1){const t=s_("text",{x:ml+i*gw+gw/2,y:H-8,"text-anchor":i===0?"start":i===dias-1?"end":"middle",class:"g-txt"});t.textContent=dmy(d).slice(0,5);svg.append(t);}});
  return svg;
}
/* curva acumulada no ano hidrológico, por pluviômetro */
function grafChuvaAcum(ps){

  const ini=new Date(inicioAnoHidro()+"T12:00:00");const n=Math.max(1,Math.round((Date.now()-ini)/86400000)+1);
  const datas=[...Array(n)].map((_,i)=>isoDia(ini.getTime()+i*86400000));

  const topo=Math.max(50,Math.ceil(Math.max(0,...series.flat())/50)*50);
  const svg=s_("svg",{viewBox:`0 0 ${W} ${H}`,width:W,height:H,class:"graf",role:"img","aria-label":"Chuva acumulada no ano hidrológico"});
  [0,0.5,1].forEach(f=>{const y=mt+ih-ih*f;
    svg.append(s_("line",{x1:ml,x2:W-mr,y1:y,y2:y,class:"g-grade"}));
    const t=s_("text",{x:ml-5,y:y+4,"text-anchor":"end",class:"g-txt"});t.textContent=nf(topo*f,0);svg.append(t);});

  return svg;
}

    const porE={};abs.forEach(a=>{const e=D.estr.find(x=>x.id===a.estrutura_id);const n=e?.nome||"—";porE[n]=(porE[n]||0)+Number(a.quantidade_kg);});
    const custoKg=premNum("custo_racao_r_kg",["geral"],null);
    cons.replaceChildren(...[
      h("dl",{class:"kv"},
        h("dt",{},"Total no período"),h("dd",{},nf(kg,0)+" kg"),
        h("dt",{},"Consumo"),h("dd",{},cabTot?nf(kg/dd/cabTot,2)+" kg/cab/dia":"—"),
        ...(custoKg!=null?[h("dt",{},"Custo"),h("dd",{},"R$ "+nf(kg*custoKg,0)+" no período · R$ "+(cabTot?nf(kg*custoKg/dd/cabTot,2):"—")+"/cab/dia")]:[])),
      Object.keys(porE).length?h("div",{},h("div",{class:"badge"},"Por cocho"),...Object.entries(porE).map(([n,v])=>h("div",{class:"ev"},n+" · "+nf(v,0)+" kg"))):h("div",{class:"note"},"Sem abastecimentos no período."),
      custoKg==null?h("div",{class:"note"},"Cadastre a premissa \"Custo da ração\" para ver o custo."):null].filter(Boolean));};
  selPer.addEventListener("change",desenhaCons);
  const b4=bloco("8 · Consumo e custo de suplementação",h("label",{class:"f"},"Período",selPer),cons);

  /* 5 — projeção de venda com sensibilidade */
  const V=VENDA();
  const diasV=Math.ceil((new Date(V.data)-hoje)/86400000);
  const sensRows=[-100,0,100].map(dp=>{const pr=V.alvo+dp;
    return h("tr",dp===0?{style:"font-weight:700"}:{},h("td",{class:"n"},"R$ "+nf(pr,0)+"/cab"+(dp===0?" (alvo)":"")),h("td",{class:"n"},"R$ "+nf(pr*cabTot,0)));});
  const b5=bloco("9 · Projeção de venda (sensibilidade de preço)",
    h("div",{class:"note"},cabTot+" cab · venda prevista "+dmy(V.data)+" ("+Math.max(0,diasV)+" dias) ",h("span",{class:"selo prog"},"Projeção")),
    tbl(["Preço","Receita"],sensRows));

  /* 6 — agenda 30 dias */
  const agItens=[...mjItensTodos(),...mjItensPastagem()].filter(i=>i.status==="programado"&&mjDelta(i.data)<=30);
  const b6=bloco("5 · Agenda — programados nos próximos 30 dias",mjAgenda(agItens,{vazio:"Nada programado para os próximos 30 dias."}));

  /* 7 — conformidade de água */
  /* pontos de água e cochos: uma linha por ponto (nome · situação à direita · detalhe embaixo), legível no celular */
  const pastosDe=e=>D.eplinks.filter(l=>l.estrutura_id===e.id).map(l=>D.pastos.find(p=>p.id===l.pasto_id)).filter(Boolean);
  const cabEm=ps=>vig.filter(m=>ps.some(p=>p.id===m.pasto_id)).reduce((s,m)=>s+m.cabecas,0);
  const aguaRows=D.estr.filter(e=>e.tipo==="ponto_agua").map(e=>{
    const ins=D.insp.filter(i=>i.estrutura_id===e.id)[0];
    const ok=ins?(ins.funcionamento&&ins.limpeza&&ins.qualidade):null;
    const falhas=ins?[["funcionamento","funcionamento"],["limpeza","limpeza"],["qualidade","qualidade da água"]].filter(([k])=>!ins[k]).map(([,r])=>r):[];
    const ps=pastosDe(e);
    return h("div",{class:"mj-row est"},h("div",{class:"mj-nome"},e.nome),
      h("div",{class:"mj-st"},ins?h("span",{class:"selo "+(ok?"vig":"bad")},ok?"OK":"Pendência"):h("span",{class:"selo hist"},"Sem inspeção")),
      h("div",{class:"mj-ult"},...(ins?[h("b",{},dm(ins.data))," · "+mjQuando(ins.data)+(falhas.length?" · pendência: "+falhas.join(", "):"")+(ins.obs?" · "+ins.obs:"")]:["nenhuma inspeção registrada"])),
      ps.length?h("div",{class:"mj-ult"},ps.map(p=>p.nome).join(", ")+(cabEm(ps)?" · "+cabEm(ps)+" cab":"")):null);});
  const b7=bloco("1 · Pontos de água — conformidade",aguaRows.length?h("div",{class:"mj-quadro"},...aguaRows):h("div",{class:"note"},"Sem pontos de água cadastrados."));

  /* 2 — pontos de cocho: último abastecimento e consumo dos últimos 7 dias por cabeça do lote no pasto vinculado */
  const cochoRows=D.estr.filter(e=>e.tipo==="cocho").map(e=>{
    const ab=D.abast.filter(a=>a.estrutura_id===e.id)[0];
    const ps=pastosDe(e),cab=cabEm(ps);
    const d7=D.abast.filter(a=>a.estrutura_id===e.id&&a.quantidade_kg&&diasDesde(a.data)<7);
    const kg7=d7.reduce((s,a)=>s+Number(a.quantidade_kg),0);
    return h("div",{class:"mj-row est"},h("div",{class:"mj-nome"},e.nome),
      h("div",{class:"mj-st"},ab?mjQuando(ab.data):h("span",{class:"selo hist"},"Sem abastecimento")),
      h("div",{class:"mj-ult"},...(ab?[h("b",{},dm(ab.data))," · "+ab.alimento+(ab.quantidade_kg?" · "+nf(ab.quantidade_kg,0)+" kg":"")+(ab.obs?" · "+ab.obs:"")]:["nenhum abastecimento registrado"])),
      h("div",{class:"mj-ult"},[ps.length?ps.map(p=>p.nome).join(", ")+(cab?" · "+cab+" cab":""):null,d7.length?"7 dias: "+nf(kg7,0)+" kg"+(cab?" · "+nf(kg7/7/cab,2)+" kg/cab/dia":""):null].filter(Boolean).join(" · ")));});
  const b11=bloco("2 · Pontos de cocho — abastecimento",
    cochoRows.length?h("div",{class:"mj-quadro"},...cochoRows):h("div",{class:"note"},"Sem cochos cadastrados."),
    h("div",{class:"note"},"Consumo por cabeça: ração dos últimos 7 dias dividida pelo lote do pasto vinculado ao cocho."));

  /* 8 — fertilidade comparativa (0-20 cm) */
  const fert=D.pastos.map(p=>{const sp=D.solo.filter(x=>x.pasto_id===p.id&&x.camada==="0-20");
    if(!sp.length)return null;const g=k=>{const r=sp.find(x=>x.atributo===k);return r?Number(r.valor):null;};
    return {nome:p.nome,v:g("v"),ph:g("ph"),p:g("p_meh"),k:g("k"),mo:g("mo")};}).filter(Boolean)
    .sort((a,b)=>(b.v??-1)-(a.v??-1));
  const b8=bloco("11 · Fertilidade comparativa (0-20 cm, ordenado por V%)",
    fert.length?tbl(["Pasto","V%","pH","P","K","MO"],fert.map(f=>h("tr",{},h("td",{},f.nome),
      ...[f.v,f.ph,f.p,f.k,f.mo].map(v=>h("td",{class:"n"},v!=null?nf(v,v<10?2:0):"—"))))):h("div",{class:"note"},"Sem fertilidade interpolada cadastrada."));

  /* 9 — resumo para WhatsApp (operacional, sem valores financeiros) */
  const resumoTxt=()=>{
    const pos=vig.map(m=>{const p=pastoDe(m);return lote(m.lote_id)+" "+m.cabecas+" cab no "+(p?.nome||"—");}).join("; ");
    const pend=aguaRows.length?D.estr.filter(e=>e.tipo==="ponto_agua").filter(e=>{const i=D.insp.filter(x=>x.estrutura_id===e.id)[0];return !i||!(i.funcionamento&&i.limpeza&&i.qualidade);}).length:0;
    const ag=agItens.slice(0,4).map(i=>dmy(i.data)+" "+i.txt).join("; ");
    return "*Chácara ZK — posição "+(D.quando?D.quando.toLocaleDateString("pt-BR")+" "+D.quando.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}):"")+"*\n"
      +"Rebanho: "+cabTot+" cab ("+pos+")\n"
      +"Água: "+(pend?pend+" ponto(s) com pendência":"sem pendências")+"\n"
      +(ag?"Agenda: "+ag:"Agenda: nada programado em 30 dias")
      +(pluvios().length?"\nChuva no mês: "+pluvios().map(e=>nomeCurto(e)+" "+nf(chuvaAcum(e.id).mes,1)+" mm").join(" · "):"")
      +(chuvaFaltas(null).length?"\nLeitura de chuva pendente: "+chuvaFaltas(null).map(f=>nomeCurto(f.p)+" ("+faltaTxt(f)+")").join(" · "):"");};
  const pre=h("pre",{class:"md"},resumoTxt());
  const btnCop=h("button",{class:"btn sm",type:"button",onclick:async()=>{try{await navigator.clipboard.writeText(resumoTxt());btnCop.textContent="Copiado ✓";}catch(e){btnCop.textContent="Selecione e copie do quadro";}}},"Copiar");
  const btnComp=(navigator.share?h("button",{class:"btn sm",type:"button",onclick:()=>navigator.share({text:resumoTxt()}).catch(()=>{})},"Compartilhar"):null);
  const b9=bloco("7 · Resumo para WhatsApp",
    h("div",{class:"note"},"Texto operacional, sem valores financeiros — seguro para encaminhar."),
    pre,h("div",{class:"inline-edit"},btnCop,btnComp));

  /* 10 — posição econômica do modelo (ponte modelo→banco; data-base explícita) */
  const pm=posicaoModelo();
  const R0=v=>"R$ "+nf(v,0);
  const b10=bloco("10 · Posição econômica do modelo",
    pm?[h("div",{class:"note"},posLinha()+" · "+pm.diasDec+" dias de ciclo desde "+dmy(pm.inicio)+" · "+pm.dias+" dias até a venda ("+dmy(pm.vendaData)+") ",h("span",{class:"selo prog"},"Projeção")," ",posSelo()),
      tbl(["Indicador","Valor"],[
        ["Breakeven por competência",R0(pm.breakeven)+"/cab"],["Breakeven de caixa",R0(pm.breakevenCaixa)+"/cab"],["Preço-alvo",R0(pm.alvo)+"/cab · margem "+R0(pm.margemCab)+"/cab"],
        ["Gasto acumulado até a data-base",R0(pm.acumulado)+" · "+R0(pm.acumulado/pm.vendaveis)+"/cab vendável"],["Gasto total projetado até a venda",R0(pm.projetado)],
        ["Desembolsado (caixa dos sócios)",R0(pm.desemb)+" · André "+R0(pm.desembAndre)+" · Danilo "+R0(pm.desembDanilo)],
        ["Equalização",pm.saldoAndre>0?"Danilo paga a André "+R0(Math.abs(pm.saldoAndre)):pm.saldoAndre<0?"André paga a Danilo "+R0(Math.abs(pm.saldoAndre)):"zerada"],
        ["Rebanho",pm.N+" cab na propriedade · "+pm.vendaveis+" vendáveis · "+pm.mortes+" morte(s)"],
        ["Ração — fase vigente",pm.fase+" · "+nf(pm.rkg,2)+" kg/cab/dia · R$ "+nf(pm.custoCabDia,2)+"/cab/dia"],
        ["Autonomia da ração em estoque",nf(pm.autonomia,0)+" dias · "+nf(pm.estKg,0)+" kg"],
        ["Estoque de insumos",R0(pm.estoqueVal)+" · compras previstas até a venda "+R0(pm.comprasPrev)],
        ["Imobilizado",R0(pm.imob)+" · depreciação plena "+R0(pm.depm)+"/mês"]].map(([l,v])=>h("tr",{},h("td",{},l),h("td",{class:"n"},v))))]
      :h("div",{class:"note"},"Posição do modelo ainda não publicada — rode a ponte modelo→banco no Mac."));

  main.replaceChildren(h("section",{class:"card"},
    h("h2",{style:"font-family:var(--f-display);font-stretch:85%;margin:0 0 4px"},"Consultas",h("span",{class:"selo vig"},"Posição vigente")),
    h("p",{class:"note"},"Respostas instantâneas calculadas da posição em "+(D.quando?D.quando.toLocaleDateString("pt-BR")+" "+D.quando.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}):"—")+". Toque numa consulta para abrir."),
    /* ordem pedida pelo André (31/10/2026): operação primeiro; depois manejo, financeiro e solo */
    grupo("Operação"),b7,b11,b1,b2,b6,b3,b9,grupo("Financeiro"),b4,b5,b10,grupo("Fertilidade"),b8));
  desenhaTL();desenhaCons();
}

/* ---------- vista: simulador — venda do lote ---------- */
/* Portado do simulador aprovado (anexo de 27/10). Só preços e quantidades de cabeças são editáveis; o restante
   vem da POSIÇÃO DO MODELO publicada pela ponte modelo→banco (posicaoModelo(): primitivos do banco + derivados
   calculados aqui, data-base explícita). Estado (modo + valores digitados) persiste ao navegar entre vistas.
   "{venda}" nos textos = data prevista de venda da posição. Valores iniciais dos campos: última simulação do usuário
   (banco, tabela simulacoes) ou, na primeira vez, o padrão calculado do preço-alvo. */
const SIM_MODES={
  lote:{label:"Lote inteiro", explain:"Um valor total pelo rebanho inteiro, entregue agora. O preço por cabeça é o valor dividido pelas cabeças.",
    fields:[["total","Valor total da proposta (R$)",b=>Math.round(b.alvo*b.N/1000)*1000,1000]]},
  frentefundo:{label:"Frente + fundo agora", explain:"Todo o rebanho sai agora para o comprador, em dois preços: a frente e o fundo. O resultado é o preço médio ponderado do lote.",
    fields:[["n1","Cabeças na frente",b=>Math.round(b.N*0.6),1],["p1","Preço da frente (R$/cab)",b=>b.alvo,10],["p2","Preço do fundo (R$/cab)",b=>b.alvo-450,10]]},
  frente:{label:"Vender a frente, manter o fundo", explain:"Só a frente sai agora; o fundo fica na propriedade, consome ração e carrega os fixos até {venda}, quando é vendido ao preço informado. A frente pode ser maioria ou minoria do lote.",
    fields:[["n1","Cabeças na frente (vendidas agora)",b=>Math.round(b.N*0.6),1],["p1","Preço da frente (R$/cab)",b=>b.alvo,10],["p2","Preço do fundo em {venda} (R$/cab)",b=>b.alvo,10]]},
  refugo:{label:"Comprador refuga", explain:"O comprador separa os refugos e leva o restante a um preço negociado. Os refugos ficam na propriedade até {venda} e são vendidos ao preço informado.",
    fields:[["q","Cabeças refugadas pelo comprador",b=>Math.round(b.N*0.1),1],["p1","Preço negociado pelos escolhidos (R$/cab)",b=>b.alvo-100,10],["p2","Preço dos refugos em {venda} (R$/cab)",b=>b.alvo-800,10]]}
};
const SIM_ST={modo:"lote",v:null,dataBase:null,origem:null,timer:null,salvoEm:null,salvoErro:null,ultimo:null};
/* Entradas do Simulador: o padrão do modelo (preço-alvo × rebanho) só vale na primeira abertura — depois, o default é
   sempre o último número digitado. Cada usuário tem a sua "última" simulação gravada no banco (tabela simulacoes, db/20;
   cópia neste aparelho como reserva, caso o banco não responda) e pode guardar cenários com nome. Nada se apaga: um
   cenário salvo com o mesmo nome é sobrescrito; sócios veem os cenários uns dos outros (só leitura — ao editar, vira a
   última simulação de quem editou). */
const simPadrao=b=>{const v={};for(const k in SIM_MODES){v[k]={};SIM_MODES[k].fields.forEach(f=>v[k][f[0]]=f[2](b));}return v;};
const simMesclar=(padrao,salvo)=>{const v={};for(const k in SIM_MODES){v[k]={};SIM_MODES[k].fields.forEach(f=>{const s=salvo?.[k]?.[f[0]];v[k][f[0]]=(s!==null&&s!==""&&Number.isFinite(Number(s)))?Number(s):padrao[k][f[0]];});}return v;};
const simEmail=()=>(D.email||"").toLowerCase();
const simChaveLocal=nome=>"zk_sim_"+simEmail()+"_"+nome;
function simUltima(){ /* última simulação do usuário: banco (D.sims) ou a cópia local, se for mais nova (editou sem gravar) */
  const bd=D.sims.find(s=>(s.usuario_email||"").toLowerCase()===simEmail()&&s.nome==="ultima")||null;
  let l=null;try{const t=localStorage.getItem(simChaveLocal("ultima"));if(t)l=JSON.parse(t);}catch(e){}
  if(l&&(!bd||String(l.atualizado_em)>String(bd.atualizado_em)))return{...l,_local:true};
  return bd;
}

  const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const b=posicaoModelo();

      h("p",{class:"note"},"O Simulador usa a posição do modelo publicada pela ponte modelo→banco — ainda não há posição publicada neste ambiente. Rode a ponte no Mac (automacao/ponte_modelo.sh) e toque em Atualizar.")));return;}
  const vendaCurta=dmy(b.vendaData).slice(0,5), db=dmy(b.dataBase);

  /* primeira abertura na sessão: última simulação do usuário (banco ou cópia local); sem nenhuma, o padrão do modelo.
     Posição nova do modelo NÃO zera o que foi digitado — os números são do usuário; cabeças acima do rebanho são
     limitadas no cálculo. */
  if(!SIM_ST.v){
    const padrao=simPadrao(b), ult=simUltima();
    if(ult){SIM_ST.v=simMesclar(padrao,ult.entradas);SIM_ST.modo=SIM_MODES[ult.modo]?ult.modo:"lote";SIM_ST.origem={tipo:"ultima",em:ult.atualizado_em,dataBase:ult.data_base,local:!!ult._local};}
    else{SIM_ST.v=padrao;SIM_ST.origem={tipo:"padrao"};}
  }
  SIM_ST.dataBase=b.dataBase;
  const st=SIM_ST.v;
  const mesNome=new Date(b.dataBase+"T12:00:00").toLocaleDateString("pt-BR",{month:"long"});
  const regras=`Regras fixas: o grupo que fica consome ração no ritmo vigente (${fmt(b.rkg,2)} kg/cab/dia a ${R(b.pkg,4)}/kg), termina o feno em estoque e carrega os fixos mensais até ${vendaCurta}; quando tudo é vendido hoje, a estrutura é considerada reocupada por novo lote (fixos fora deste ciclo). Fixos mensais pela regra "serviço pleno" (último mês realizado sem depreciação + depreciação plena); o mês da data-base entra pro-rata. Depreciação é custo sem caixa; imobilizado e estoque que sobram são ativos da sociedade. Sem impostos, comissão ou frete de saída.`;

  main.replaceChildren(h("section",{class:"card sim"},h("div",{id:"sv-root"})));

  root.innerHTML=`
    <h2 style="font-family:var(--f-display);font-stretch:85%;margin:0 0 4px">Simulador de Venda do Lote <span class="selo prog">Projeção</span></h2>
    <p class="note" style="max-width:72ch">Ferramenta de decisão: escolha a forma de venda, mude os números e veja na hora o resultado do ciclo por competência e por caixa. Só preços e quantidades de cabeças são editáveis; o restante vem da posição do modelo de ${db}. O que não é vendido agora permanece na propriedade e é vendido em ${dmy(b.vendaData)}.</p>
    <div class="sim-grid">
      <details class="sim-panel" open>
        <summary class="sum-pos"><span class="st">Posição do modelo · <span class="nw">${db}</span></span><span id="sv-posSelo"></span></summary>
        <div style="margin-top:10px" id="sv-baseList"></div>
        <p class="note" style="margin-top:8px;font-size:12px">Modelo Gestao_Agropecuaria_Dois_Amigos com data-base ${db}, publicado em ${fmtPub(b.publicadoEm)} (fase de ração vigente: ${b.fase}; ${b.mortes} morte(s) registrada(s); feno apontado ${fmt(b.fenoRolos,0)} rolos). Muda quando o modelo é recalculado e a ponte publica a nova posição.</p>
      </details>
      <div>
        <div class="sim-tabs" role="tablist">
          <button class="sim-tab" role="tab" data-mode="lote">Lote inteiro</button>
          <button class="sim-tab" role="tab" data-mode="frentefundo">Frente + fundo agora</button>
          <button class="sim-tab" role="tab" data-mode="frente">Vender a frente, manter o fundo</button>
          <button class="sim-tab" role="tab" data-mode="refugo">Comprador refuga</button>
        </div>
        <div class="sim-panel">
          <p class="explica" id="sv-explain"></p>
          <div class="sim-modegrid" id="sv-modeInputs"></div>
        </div>
        <div class="sim-bar">
          <span class="note" id="sv-estado" aria-live="polite"></span>
          <div class="sim-acoes">
            <button class="btn sm" type="button" id="sv-salvas" aria-expanded="false" aria-controls="sv-lista">Salvas</button>
            <button class="btn sm" type="button" id="sv-salvarComo">Salvar como…</button>
            <button class="btn sm" type="button" id="sv-xlsx" title="Planilha Excel com entradas, resultado, caixa e ração deste cenário">Resumo em Excel</button>
            <button class="btn sm" type="button" id="sv-pdf" title="Abre a impressão só com o resumo — escolha Salvar como PDF">Resumo em PDF</button>

        </div>

  const $S=id=>root.querySelector("#sv-"+id);

  // cenário genérico: grupo 1 vendido agora (n1,p1); grupo 2 (n2) vendido em d2 dias a p2; ociosa = fixos continuam sem animais
  function run(s){
    const n1=Math.max(0,Math.min(b.N,s.n1)), n2=b.N-n1, d2=n2>0?Math.max(0,s.d2):0, m2=Math.max(0,Math.min(n2,s.m2||0));
    const rec1=n1*s.p1, rec2=(n2-m2)*s.p2, rec=rec1+rec2, vend=n1+(n2-m2);

    const racAdd=n2*b.rcd*d2+fenoAdd;

    const fixAdd=b.fixm*dFix/30.4, depAdd=b.depm*dFix/30.4;

    const gasto=b.gastoA+racAdd+fixAdd+vendaC, res=rec-gasto;

    const futuro=racCompra+(fixAdd-depAdd)+vendaC, comp=b.desemb+b.apagar+futuro, saldo=rec-comp;
    const imobLiq=b.imob-b.deplan-depAdd, econ=saldo+imobLiq+estFinal;
    return {n1,n2,d2,m2,rec1,rec2,rec,vend,racAdd,fenoAdd,fixAdd,depAdd,vendaC,gasto,res,racCompra,estFinal,futuro,comp,saldo,imobLiq,econ,pm:vend?rec/vend:0,custoCab:vend?gasto/vend:0,margem:rec?res/rec:0,dFix};
  }
  function scenario(){
    const v=st[SIM_ST.modo];

    if(SIM_ST.modo==="frentefundo") return {n1:v.n1,p1:v.p1,d2:0,p2:v.p2,m2:0,ociosa:false};
    if(SIM_ST.modo==="frente") return {n1:v.n1,p1:v.p1,d2:b.dias,p2:v.p2,m2:0,ociosa:false};
    return {n1:b.N-v.q,p1:v.p1,d2:b.dias,p2:v.p2,m2:0,ociosa:false};
  }
  const cls=v=>v>=0?"pos":"neg";
  /* linhas do resultado em estrutura única: a tela e os arquivos exportados saem das mesmas linhas (o que se baixa é

  function linhas(s,r){
    const grupo2=r.n2>0?(r.d2>0?`${r.n2} cab em ${vendaCurta} a ${R(s.p2,0)}`:`${r.n2} cab agora a ${R(s.p2,0)}`):"—";
    const porCab=v=>R(r.vend?v/r.vend:0);
    const kpis=[["Receita total",R(r.rec,0),`${r.vend} cab · preço médio ${R(r.pm,0)}/cab`,""],
      ["Resultado do ciclo (competência)",sgn(r.res),`margem ${pct(r.margem)} · ${R(r.vend?r.res/r.vend:0,0)}/cab`,cls(r.res)],
      ["Custo completo por cabeça",R(r.custoCab,0),"breakeven do cenário",""]];
    const dre=[["Receita — grupo vendido agora ("+r.n1+" cab a "+R(s.p1,0)+")",R(r.rec1),porCab(r.rec1)],
      ["Receita — restante ("+grupo2+")",R(r.rec2),porCab(r.rec2)],
      ["Aquisição do rebanho + frete",R(b.aquisFrete),porCab(b.aquisFrete)],
      ["Manejo sanitário",R(b.sanit),porCab(b.sanit)],
      ["Ração consumida até "+db,R(b.rac),porCab(b.rac)],
      ["Gastos operacionais do ciclo (OP)",R(b.op),porCab(b.op)],
      ["Fixos de produção + despesas até "+db,R(b.fixp+b.adm),porCab(b.fixp+b.adm)],
      [`Ração do grupo que fica (${r.n2} cab × ${fmt(b.rkg)} kg × ${r.d2} d × ${R(b.pkg,4)}/kg${r.fenoAdd?" + feno restante "+R(r.fenoAdd,0):""})`,R(r.racAdd),porCab(r.racAdd)],
      [`Fixos até a venda do restante (${fmt(r.dFix,0)} dias, inclui depreciação ${R(r.depAdd,0)})`,R(r.fixAdd),porCab(r.fixAdd)],

    const econNote="Conciliação: resultado econômico − resultado por competência = "+R(r.econ-r.res)+" (deve ser zero). Breakeven de caixa do cenário: "+R(r.vend?r.comp/r.vend:0,0)+"/cab.";
    const kgCab=b.kgHoje/b.N, rsCab=b.rac/b.N;
    const racHoje=[["Ração base consumida pelo lote ("+dmy(b.inicio)+" → "+db+")",fmt(b.kgHoje,0)+" kg · "+R(b.racBase)],
      ["Feno apontado ("+fmt(b.fenoRolos,0)+" rolos × "+fmt(b.fenoKgRolo,0)+" kg)",fmt(b.fenoRolos,0)+" rolos · "+fmt(b.fenoKg,0)+" kg · "+R(b.feno)],
      ["Custo total da alimentação consumida",R(b.rac)],["Custo médio ponderado da ração base",R(b.kgHoje?b.racBase/b.kgHoje:0,4)+"/kg"],
      ["Por cabeça ("+b.N+" cab)",fmt(kgCab,0)+" kg de ração base · "+R(rsCab)],
      ["Fase vigente — "+b.fase,fmt(b.rkg*b.N,0)+" kg/dia · "+fmt(b.rkg,2)+" kg/cab/dia · "+R(b.pkg,4)+"/kg"],
      ["Estoque de ração base em "+db,fmt(b.estKg,0)+" kg · "+R(b.estrac)],["Feno em estoque",R(b.estfeno)+" · "+fmt(b.estfenoRolos,0)+" rolos"],["Mineral à vontade (Phoscerrado)",R(b.estmin)+" · "+fmt(b.mineralKg,0)+" kg"]];

        ["Consumo diário do grupo",fmt(r.n2*b.rkg,0)+" kg/dia · "+R(r.n2*b.rcd)],
        ["Ração prevista até a venda",fmt(kgFut,0)+" kg · "+R(r.racAdd-r.fenoAdd)+(r.fenoAdd?" + feno "+R(r.fenoAdd,0):"")],
        ["Coberto pelo estoque atual",fmt(Math.min(kgFut,b.estKg),0)+" kg · "+R(Math.min(r.racAdd-r.fenoAdd,b.estrac))],
        ["Compra necessária além do estoque",fmt(Math.max(0,kgFut-b.estKg),0)+" kg · "+R(r.racCompra),undefined,"tot"],
        ["Por cabeça que fica",fmt(b.rkg*r.d2,0)+" kg · "+R(b.rcd*r.d2)]];
      racFutNote="Autonomia do estoque atual para esse grupo: "+fmt(autonomia,0)+" dias. Ritmo fixo da fase vigente; o consumo acompanha o peso vivo e tende a subir conforme as novilhas crescem.";
    }else{
      racFut=[["Cabeças que ficam","0 cab"],["Ração futura deste lote",R(0)],["Estoque que fica para o próximo lote",fmt(b.estKg,0)+" kg · "+R(b.estrac)],["Feno, mineral e núcleos que ficam",R(b.estfeno+b.estmin+b.estoutros)]];
      racFutNote="Tudo vendido hoje: não há ração futura; o estoque é ativo da sociedade para o próximo lote.";
    }
    return {kpis,dre,caixa,econNote,racHoje,racFut,racFutNote};
  }
  const row=(l,a,b2,c,vc)=>`<tr class="${c||""}"><td>${l}</td><td class="n ${vc||""}">${a}</td>${b2!==undefined?`<td class="n">${b2}</td>`:""}</tr>`;
  const tabela=(cab,rs)=>`<tr>${cab.map((c,i)=>`<th${i?' class="n"':""}>${c}</th>`).join("")}</tr>`+rs.map(x=>row(...x)).join("");

  function calc(){
    const s=scenario(), r=run(s), L=linhas(s,r);
    SIM_ST.ultimo={s,r,L};
    $S("kpis").innerHTML=L.kpis.map(([l,v,sub,vc])=>`<div class="kpi"><div class="l">${l}</div><div class="v ${vc}">${v}</div><div class="s">${sub}</div></div>`).join("");igualarKpis();
    $S("dre").innerHTML=tabela(["Item","R$","R$/cab vendida"],L.dre);

    $S("racHoje").innerHTML=tabela(["Item","Valor"],L.racHoje);

  function renderInputs(){
    const m=SIM_MODES[SIM_ST.modo]; $S("explain").textContent=T(m.explain);
    const box=$S("modeInputs"); box.innerHTML="";
    m.fields.forEach(([id,label,def,step])=>{
      const div=document.createElement("div"); div.className="sim-field";
      /* campo de texto numérico com ponto de milhar (pt-BR) enquanto se digita; o valor guardado é o número inteiro */
      const milhar=v=>Math.round(Number(v)||0).toLocaleString("pt-BR",{maximumFractionDigits:0});
      div.innerHTML=`<label for="sv-f-${id}">${T(label)}</label><input type="text" inputmode="numeric" autocomplete="off" id="sv-f-${id}" value="${milhar(st[SIM_ST.modo][id])}">`;
      box.appendChild(div);
      const inp=div.querySelector("input");
      inp.addEventListener("input",()=>{
        const pos=inp.selectionStart??inp.value.length, digAntes=inp.value.slice(0,pos).replace(/\D/g,"").length;
        const dig=inp.value.replace(/\D/g,"").replace(/^0+(?=\d)/,"");
        const v=dig?Number(dig):0; inp.value=dig?milhar(v):"";
        let k=0,np=0; while(np<inp.value.length&&k<digAntes){if(/\d/.test(inp.value[np]))k++;np++;}
        try{inp.setSelectionRange(np,np);}catch(e){}
        st[SIM_ST.modo][id]=v;calc();simAgendarSalvar();});
      inp.addEventListener("blur",()=>{inp.value=milhar(st[SIM_ST.modo][id]);});
    });
    calc();
  }
  const marcarAba=()=>root.querySelectorAll(".sim-tab").forEach(t=>t.setAttribute("aria-selected",t.dataset.mode===SIM_ST.modo?"true":"false"));
